<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>전화</title>
<link rel="stylesheet" href="https://cnstkal.github.io/Hwaho2/css/base.css">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
#device{position:fixed;inset:0;background:#fff}
#screen{position:relative;width:100%;height:100%;max-width:none;max-height:none;margin:0;border-radius:0;overflow:hidden;background:#fff;box-shadow:none}
#wallpaper,#home,#home-indicator-zone{display:none!important}
#statusbar{display:none!important}
#tel-app{display:flex!important;position:absolute;inset:0;z-index:5;width:100%;height:100%;opacity:1;transform:none;border-radius:0;overflow:hidden;background:#fff}
@media (min-width:520px) and (min-height:600px){#device{background:#fff}#screen{width:min(390px,calc((100vh - 32px)*390/844));height:min(844px,calc(100vh - 32px));margin:auto;border-radius:44px;box-shadow:0 0 0 1px #ddd;}}
</style></head><body>
<div id="device"><div id="screen">
<div id="wallpaper"></div><header id="statusbar"><span id="clock">9:41</span></header><div id="home"></div>
<div id="tel-app" aria-hidden="false"></div><div id="msg-app" aria-hidden="true"></div><div id="home-indicator-zone"><div id="home-indicator"></div></div>
</div></div>
<script src="https://cnstkal.github.io/Hwaho2/js/phone.js"></script>
<script src="https://cnstkal.github.io/Hwaho2/js/phone-layout-fix.js"></script>
<script>
/* Standalone host for the original Hwaho2 PhoneApp module */
window.Home={current:"phone",openApp(id){this.current=id;if(id==="phone"&&window.PhoneApp&&PhoneApp.open)PhoneApp.open();}};
window.addEventListener("load",()=>{if(window.PhoneApp&&PhoneApp.open)PhoneApp.open();});
</script></body></html>
