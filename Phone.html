<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>전화</title><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif}.wrap{height:100dvh;display:flex;flex-direction:column;padding:18px 20px 24px}.top{display:flex;justify-content:space-between;color:#1684ff;font-size:16px}.title{text-align:center;font-size:30px;font-weight:700;margin:26px 0}.search{background:#f1f1f5;border-radius:12px;padding:12px 14px;color:#8e8e93}.number{text-align:center;min-height:34px;font-size:25px;margin-top:22px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px auto;max-width:300px;width:100%}.key{height:65px;border-radius:50%;background:#f2f2f7;display:flex;align-items:center;justify-content:center;font-size:28px}.call{width:64px;height:64px;border-radius:50%;background:#34c759;color:white;display:grid;place-items:center;margin:0 auto;font-size:28px;border:0}.hint{text-align:center;color:#8e8e93;font-size:12px;margin-top:9px}.tabs{display:flex;justify-content:space-around;margin-top:auto;padding-top:16px;border-top:1px solid #ddd;color:#777;font-size:11px}.tab{text-align:center}.tab b{display:block;font-size:23px;font-weight:500;margin-bottom:4px}.active{color:#1684ff}</style></head><body><div class="wrap"><div class="top"><span>편집</span><span>즐겨찾기</span></div><div class="title">키패드</div><div class="search">⌕ 이름 또는 번호 검색</div><div class="number" id="number"></div><div class="keypad"><div class="key" onclick="document.getElementById('number').textContent+= '1'">1</div><div class="key" onclick="document.getElementById('number').textContent+= '2'">2</div><div class="key" onclick="document.getElementById('number').textContent+= '3'">3</div><div class="key" onclick="document.getElementById('number').textContent+= '4'">4</div><div class="key" onclick="document.getElementById('number').textContent+= '5'">5</div><div class="key" onclick="document.getElementById('number').textContent+= '6'">6</div><div class="key" onclick="document.getElementById('number').textContent+= '7'">7</div><div class="key" onclick="document.getElementById('number').textContent+= '8'">8</div><div class="key" onclick="document.getElementById('number').textContent+= '9'">9</div><div class="key" onclick="document.getElementById('number').textContent+= '*'">*</div><div class="key" onclick="document.getElementById('number').textContent+= '0'">0</div><div class="key" onclick="document.getElementById('number').textContent+= '#'">#</div></div><button class="call" onclick="alert('가상 전화 앱이야. 실제 통화는 연결되지 않아.')">☎</button><div class="hint">실제 통화 기능은 제공하지 않아</div><div class="tabs"><div class="tab"><b>☆</b>즐겨찾기</div><div class="tab"><b>◷</b>최근 통화</div><div class="tab"><b>♙</b>연락처</div><div class="tab active"><b>▦</b>키패드</div><div class="tab"><b>⌕</b>음성 사서함</div></div></div></body></html>
