<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<title>캘린더</title>
<style>
:root{
  --red:#e8494a;
  --gray:#939398;
  --line:#e1e1e4;
  --st:max(env(safe-area-inset-top,0px),54px);
  --sb:max(env(safe-area-inset-bottom,0px),20px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#fff;overscroll-behavior:none}
body{font-family:var(--font);color:#000;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;font-size:17px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;font-size:17px;color:#000;-webkit-user-select:text;user-select:text}
svg{display:block}
#app{position:fixed;inset:0;background:#fff;overflow:hidden}
#screen{position:absolute;inset:0;touch-action:pan-y}
.screen{height:100%;display:flex;flex-direction:column;padding-top:var(--st)}

/* status bar */
#statusbar{position:absolute;left:0;right:0;top:0;height:var(--st);z-index:60;pointer-events:none;display:flex;align-items:flex-start;justify-content:space-between}
.sb-l{width:112px;height:58px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;letter-spacing:-.2px;padding-top:0;margin-top:-4px;margin-left:0}
.sb-l,.sb-r{height:54px}
.island{position:absolute;left:50%;top:11px;width:126px;height:37px;margin-left:-63px;border-radius:20px;background:#000}
.sb-r{width:112px;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:-4px;padding-left:0}
.sb-r .wifi{width:19px;height:14px}
.batt{position:relative;width:28px;height:13px;border-radius:4px;background:#63cf55;display:block}
.batt b{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff;letter-spacing:-.3px}
.batt i{position:absolute;right:-3px;top:4px;width:2px;height:5px;border-radius:0 2px 2px 0;background:#b4b4b8}
.home-ind{position:absolute;left:50%;bottom:8px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#000;z-index:70;pointer-events:none}

/* pills */
.topbar{display:flex;justify-content:space-between;align-items:center;padding:5px 16px 0;height:49px;flex:none}
.pill{background:#fff;border:1px solid #e4e4e8;border-radius:22px;height:44px;display:flex;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.06)}
.pill.back{padding:0 18px 0 9px;font-size:20px;font-weight:500;gap:3px;letter-spacing:-.3px}
.pill.back svg{width:26px;height:26px}
.pill.grp{padding:0 2px}
.ibtn{width:56px;height:42px;display:grid;place-items:center}
.ibtn svg{width:28px;height:28px;stroke:#111;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pill.txt{padding:0 19px;font-size:19px;font-weight:500;letter-spacing:-.3px}
.bbar{position:absolute;left:28px;right:28px;bottom:calc(var(--sb) + 8px);display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:5}
.bbar .pill{pointer-events:auto;height:49px;border-radius:25px;background:rgba(255,255,255,.96)}
.bbar .today{padding:0 20px;font-size:20px;font-weight:500;letter-spacing:-.3px;height:49px}
.bbar .ibtn{width:55px;height:47px}

/* month */
.mtitle{font-size:34px;font-weight:700;height:46px;margin-top:11px;padding-left:20px;line-height:46px;letter-spacing:-.5px;flex:none}
.wkhead{display:grid;grid-template-columns:repeat(7,1fr);height:25px;flex:none;border-bottom:1px solid var(--line)}
.wkhead span{text-align:center;font-size:13px;font-weight:600;line-height:25px}
.wkhead span.w,.wd.w{color:var(--gray)}
.mgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);padding-bottom:calc(var(--sb) + 28px)}
.cell{border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:stretch;min-width:0;min-height:0;cursor:pointer}
.mgrid .cell:nth-child(-n+7){border-top:0}
.num{width:39px;height:39px;border-radius:50%;margin:8px auto 8px;text-align:center;line-height:39px;font-size:24px;font-weight:600;flex:none}
.num.wke{color:var(--gray)}
.num.today{background:var(--red);color:#fff}
.num.sel{background:#000;color:#fff}
.chips{flex:1;min-height:0;overflow:hidden;padding:0 2px}
.chip{height:17px;margin-bottom:3px;border-radius:9px;display:flex;align-items:center;gap:3px;padding:0 3px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;letter-spacing:-.3px}
.chip span{overflow:hidden;text-overflow:clip;flex:1;min-width:0;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.more{font-size:12px;font-weight:600;color:var(--gray);text-align:center;height:17px;line-height:17px}
.ci{width:13px;height:13px;border-radius:50%;display:grid;place-items:center;flex:none}
.ci svg{width:8px;height:8px;stroke:#fff;fill:#fff;stroke-width:1.6}
.dot{width:7px;height:7px;border-radius:50%;flex:none;margin:0 2px}

/* day */
.strip{display:grid;grid-template-columns:repeat(7,1fr);height:62px;flex:none;padding-top:2px;border-bottom:1px solid var(--line)}
.strip button{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px}
.strip .wd{font-size:12.5px;font-weight:600;line-height:16px;margin-top:3px}
.strip .dn{font-size:26px;line-height:28px;height:28px;min-width:34px;padding:0 4px;border-radius:9px;font-weight:400;letter-spacing:-.4px}
.strip .dn.w{color:var(--gray)}
.strip .dn.sel{background:#000;color:#fff}
.strip .dn.today{background:var(--red);color:#fff}
.dtitle{height:36px;line-height:36px;text-align:center;font-size:16px;font-weight:700;border-bottom:1px solid var(--line);flex:none;letter-spacing:-.3px}
.allday{display:flex;align-items:flex-start;padding:4px 0 5px;border-bottom:1px solid var(--line);flex:none;max-height:130px;overflow:auto}
.adl{width:80px;text-align:right;padding-right:10px;color:var(--gray);font-size:14px;line-height:1.15;padding-top:2px;flex:none}
.adc{flex:1;display:flex;flex-direction:column;gap:3px;padding-right:2px;min-width:0}
.achip{height:26px;border-radius:13px;display:flex;align-items:center;gap:7px;padding:0 6px 0 3px;font-weight:600;font-size:15px;overflow:hidden;white-space:nowrap}
.achip .ci{width:20px;height:20px}
.achip .ci svg{width:12px;height:12px}
.achip span{overflow:hidden;text-overflow:ellipsis}
.dscroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.hours{position:relative;height:calc(24*56px + 12px + 150px)}
.hl{position:absolute;left:80px;right:0;height:1px;background:#dcdcdf}
.hlab{position:absolute;left:0;width:73px;text-align:right;transform:translateY(-50%);color:#7c7c82;white-space:nowrap;line-height:1}
.hlab small{font-size:12.5px;color:#8e8e93}
.hlab b{font-size:19px;font-weight:400;margin-left:2px;color:#6b6b70}
.hlab em{font-style:normal;font-size:16px;color:#6b6b70}
.hlab.noon{color:#000;font-size:15px;font-weight:600}
.blk{position:absolute;border-radius:6px;padding:2px 6px;overflow:hidden;font-size:13px;line-height:1.25;border-left:3px solid;cursor:pointer}
.blk b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk span{font-size:12px;opacity:.85;white-space:nowrap}
.nowline{position:absolute;left:78px;right:0;height:2px;background:var(--red);z-index:2;pointer-events:none}
.nowline:before{content:"";position:absolute;left:-1px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--red)}

/* year */
.ytitle{font-size:34px;font-weight:700;height:40px;line-height:40px;text-align:center;color:var(--red);flex:none;letter-spacing:-.5px;margin-top:0}
.yscroll{flex:1;min-height:0;overflow-y:auto;padding:6px 20px calc(var(--sb) + 100px);display:grid;grid-template-columns:repeat(3,1fr);column-gap:19px;align-content:start;touch-action:pan-y}
.mm{height:156px;cursor:pointer}
.mname{font-size:27px;font-weight:700;height:34px;line-height:34px;letter-spacing:-.5px;margin-bottom:9px}
.mname.red{color:var(--red)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);row-gap:0}
.mg span{height:19.3px;line-height:19.3px;text-align:center;font-size:14px;font-weight:600;letter-spacing:-.4px}
.mg span.t{background:var(--red);color:#fff;border-radius:4px}
.mg span.s{background:#000;color:#fff;border-radius:4px}

/* list */
.lscroll{flex:1;min-height:0;overflow-y:auto;padding-bottom:calc(var(--sb) + 100px);touch-action:pan-y}
.lh{font-size:14px;font-weight:600;color:var(--gray);padding:12px 20px 6px;background:#f7f7f9;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.lh.t{color:var(--red)}
.li{display:flex;align-items:stretch;gap:10px;padding:10px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.li i{width:4px;border-radius:2px;flex:none}
.li b{display:block;font-size:17px;font-weight:600}
.li small{font-size:14px;color:var(--gray)}
.empty-msg{text-align:center;color:var(--gray);padding:60px 20px;font-size:17px}

/* sheet */
#backdrop{position:absolute;inset:0;background:rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40}
#backdrop.on{opacity:1;pointer-events:auto}
#sheet{position:absolute;left:0;right:0;top:calc(var(--st) + 5px);bottom:0;background:#f1f1f6;border-radius:40px 40px 0 0;z-index:50;transform:translateY(105%);transition:transform .34s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;overflow:hidden;touch-action:pan-y}
#sheet.on{transform:none}
.shead{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 0;flex:none;gap:10px}
.shead .pill{box-shadow:0 3px 10px rgba(0,0,0,.05)}
.cbtn{width:44px;padding:0;justify-content:center}
.cbtn svg{width:26px;height:26px;stroke:#111;stroke-width:2.4;fill:none;stroke-linecap:round}
.sbody{flex:1;min-height:0;overflow-y:auto;padding:22px 16px calc(var(--sb) + 40px)}
.dhead{display:flex;gap:11px;margin:6px 0 30px 2px}
.dbar{width:6px;border-radius:3px;flex:none}
.dt{font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.5px;word-break:break-word;margin-bottom:12px;padding-top:2px}
.dd{font-size:19px;line-height:1.35;letter-spacing:-.3px}
.dx{font-size:16px;color:#6b6b70;margin-top:8px;white-space:pre-wrap;word-break:break-word}
.sec{font-size:19px;font-weight:600;color:var(--gray);margin:0 0 12px 18px}
.row{background:#fff;border-radius:27px;min-height:54px;display:flex;align-items:center;padding:0 20px 0 16px;margin-bottom:10px;gap:12px;position:relative;font-size:18px;letter-spacing:-.3px}
.row svg.l{width:26px;height:26px;stroke:#76767b;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.row .sp{flex:1}
.row .val{color:#7c7c82;display:flex;align-items:center;gap:8px}
.row .val svg{width:20px;height:20px;stroke:#76767b;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.row .cdot{width:21px;height:21px;border-radius:50%}
.row select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:17px;-webkit-appearance:none;appearance:none}
.row.del{justify-content:center;color:var(--red);margin-top:34px;cursor:pointer;font-size:19px}
.card{background:#fff;border-radius:27px;margin-bottom:12px;overflow:hidden}
.card .row{background:none;border-radius:0;margin:0;border-bottom:1px solid #ececf0;min-height:52px;padding:0 16px 0 20px}
.card .row:last-child{border-bottom:0}
.card input[type=text],.card textarea{width:100%;border:0;outline:0;background:none;padding:15px 20px;font-size:19px}
.card input.big{font-size:22px;font-weight:600;padding:18px 20px 12px}
.card textarea{min-height:110px;resize:none;display:block;font-size:17px}
.pair{display:flex;gap:6px;align-items:center}
.pair input{border:0;background:#eeeef1;border-radius:9px;padding:6px 9px;font-size:17px;height:36px;min-width:0;outline:0}
.pair input[type=date]{width:150px}
.pair input[type=time]{width:105px}
.allday-on .timed{display:none}
.allday-on .pair input[type=date]{width:150px}
.sw{position:relative;width:51px;height:31px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;z-index:2;margin:0}
.sw i{position:absolute;inset:0;border-radius:16px;background:#e4e4e8;transition:background .2s}
.sw i:after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked+i{background:#34c759}
.sw input:checked+i:after{transform:translateX(20px)}
.sbox{flex:1;height:44px;border-radius:22px;background:#fff;border:1px solid #e4e4e8;display:flex;align-items:center;padding:0 14px;gap:8px}
.sbox svg{width:22px;height:22px;stroke:#8e8e93;stroke-width:2.4;fill:none;stroke-linecap:round;flex:none}
.sbox input{flex:1;border:0;outline:0;background:none;min-width:0;font-size:17px}
.res{background:#fff;border-radius:22px;overflow:hidden}
.res .li{border-bottom:1px solid #ececf0}
.res .li:last-child{border-bottom:0}
.crow{display:flex;align-items:center;gap:12px;padding:0 14px;min-height:54px;border-bottom:1px solid #ececf0}
.crow:last-child{border-bottom:0}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid;display:grid;place-items:center;flex:none}
.ck svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.crow input[type=text]{flex:1;border:0;background:none;outline:0;min-width:0;font-size:17px;height:48px}
.crow input[type=color]{width:32px;height:32px;border:0;padding:0;background:none;border-radius:50%;overflow:hidden;flex:none}
.crow input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.crow input[type=color]::-webkit-color-swatch{border:0;border-radius:50%}
.crow .rm{color:var(--red);font-size:15px;padding:6px}
.addc{display:block;width:100%;text-align:left;color:#0a84ff;font-size:17px;font-weight:500;padding:16px 20px;background:#fff;border-radius:22px;margin-top:12px}

#toast{position:absolute;left:12px;right:12px;top:calc(var(--st) + 4px);background:rgba(250,250,252,.97);border:1px solid #e1e1e4;border-radius:20px;padding:12px 16px;z-index:80;font-size:15px;transform:translateY(-140%);transition:transform .35s cubic-bezier(.32,.72,0,1);box-shadow:0 8px 24px rgba(0,0,0,.12)}
#toast.on{transform:none}
#toast b{display:block;font-size:16px}
</style>
</head>
<body>
<div id="app">
  <div id="screen"></div>
  <div id="backdrop"></div>
  <div id="sheet"></div>
  <div id="statusbar">
    <div class="sb-l"><span id="sb-time">5:13</span></div>
    <div class="island"></div>
    <div class="sb-r">
      <svg class="wifi" viewBox="0 0 20 15" aria-hidden="true"><path d="M10 12.2a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2zM4.9 9.1l1.6 1.7a4.9 4.9 0 0 1 7 0l1.6-1.7a7.2 7.2 0 0 0-10.2 0zM1.2 5.4l1.6 1.7a10.2 10.2 0 0 1 14.4 0l1.6-1.7a12.5 12.5 0 0 0-17.6 0z" fill="#000" transform="translate(0 -1.5)"/></svg>
      <span class="batt"><b>65</b><i></i></span>
    </div>
  </div>
  <div id="toast"></div>
  <div class="home-ind"></div>
</div>
<script>
'use strict';
(() => {
const TZ = 'Asia/Seoul';
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const HH = 56; // hour height
const TOP = 12; // grid top padding
const pad = n => String(n).padStart(2, '0');
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- date helpers (all KST, string based) ---------- */
function kstNow() {
  const p = {};
  new Intl.DateTimeFormat('en-GB', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date()).forEach(x => { if (x.type !== 'literal') p[x.type] = x.value; });
  return { key: `${p.year}-${p.month}-${p.day}`, h: +p.hour, mi: +p.minute };
}
const today = () => kstNow().key;
const key = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return { y, m: m - 1, d }; }
function addDays(k, n) { const { y, m, d } = parseKey(k); const dt = new Date(Date.UTC(y, m, d + n)); return key(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate()); }
function dow(k) { const { y, m, d } = parseKey(k); return new Date(Date.UTC(y, m, d)).getUTCDay(); }
const monIdx = k => (dow(k) + 6) % 7;
const dim = (y, m) => new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
function addMonths(k, n) { const { y, m, d } = parseKey(k); const t = y * 12 + m + n; const ny = Math.floor(t / 12), nm = t - ny * 12; return key(ny, nm, Math.min(d, dim(ny, nm))); }
const weekStart = k => addDays(k, -monIdx(k));
function fmtLong(k) { const { y, m, d } = parseKey(k); return `${y}년 ${m + 1}월 ${d}일 ${WD[dow(k)]}요일`; }
function fmtShort(k) { const { m, d } = parseKey(k); return `${m + 1}월 ${d}일 ${WD[dow(k)]}요일`; }
function fmtTime(t) { const [h, mi] = t.split(':').map(Number); return `${h < 12 ? '오전' : '오후'} ${h % 12 || 12}:${pad(mi)}`; }
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const fromMin = n => `${pad(Math.floor(n / 60))}:${pad(n % 60)}`;
function absMin(k, t) { const { y, m, d } = parseKey(k); return Date.UTC(y, m, d) / 86400000 * 1440 + toMin(t); }
function fromAbs(a) { const days = Math.floor(a / 1440); const mi = a - days * 1440; const dt = new Date(days * 86400000); return { k: key(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate()), t: fromMin(mi) }; }

/* ---------- holidays (Korea) ---------- */
const FIXED = { '01-01': '신정', '03-01': '삼일절', '05-05': '어린이날', '06-06': '현충일', '08-15': '광복절', '10-03': '개천절', '10-09': '한글날', '12-25': '성탄절' };
const EXTRA = {
  2024: { '02-09': '설날', '02-10': '설날', '02-11': '설날', '02-12': '설날', '04-10': '국회의원 선거', '05-06': '어린이날', '05-15': '부처님오신날', '09-16': '추석', '09-17': '추석', '09-18': '추석', '10-01': '국군의 날' },
  2025: { '01-27': '임시공휴일', '01-28': '설날', '01-29': '설날', '01-30': '설날', '03-03': '삼일절', '05-06': '부처님오신날', '06-03': '대통령 선거', '10-05': '추석', '10-06': '추석', '10-07': '추석', '10-08': '추석' },
  2026: { '02-16': '설날', '02-17': '설날', '02-18': '설날', '03-02': '삼일절', '05-24': '부처님오신날', '05-25': '부처님오신날', '06-03': '지방선거', '08-17': '광복절', '09-24': '추석', '09-25': '추석', '09-26': '추석', '10-05': '개천절' },

    cluster.forEach(it => { it.n = cols.length; }); res.push(...cluster); cluster = []; cEnd = -1;

/* ---------- render ---------- */
function render() {

  const v = S.view;
  $('#screen').innerHTML = v === 'year' ? viewYear() : v === 'day' ? viewDay() : v === 'list' ? viewList() : viewMonth();
  if (v === 'month') requestAnimationFrame(layoutChips);
  if (v === 'day') {
    const sc = $('#dscroll');
    if (S.dayTop == null) {
      const ts = layoutDay(S.sel); const first = ts.length ? Math.min(...ts.map(i => i.s)) : 240;
      const hr = Math.min(4, Math.floor(first / 60));
      S.dayTop = Math.max(0, hr * HH + TOP - 37);

    sc.scrollTop = S.dayTop;
  }
}
function layoutChips() {
  document.querySelectorAll('.chips').forEach(c => {
    const kids = [...c.children].filter(x => !x.classList.contains('more'));
    kids.forEach(k => { k.style.display = ''; }); c.querySelectorAll('.more').forEach(x => x.remove());
    const cap = Math.max(0, Math.floor((c.clientHeight + 3) / 20));
    if (kids.length <= cap) return;
    const keep = Math.max(0, cap - 1);
    kids.forEach((k, i) => { if (i >= keep) k.style.display = 'none'; });
    const more = document.createElement('div'); more.className = 'more'; more.textContent = `+${kids.length - keep}개`; c.appendChild(more);
  });
}

  openSheet(`${sheetHead('<button class="pill txt" data-act="saveEv" style="font-weight:600">완료</button>')}
    <div class="sbody" id="eform" data-id="${d.id || ''}">
    <div class="card"><input class="big" id="f-title" type="text" placeholder="제목" value="${esc(d.title)}" autocomplete="off"><div style="height:1px;background:#ececf0;margin:0 20px"></div><input id="f-loc" type="text" placeholder="위치" value="${esc(d.loc)}" autocomplete="off"></div>
    <div class="card${d.allDay ? ' allday-on' : ''}" id="when">
      <div class="row"><span>종일</span><span class="sp"></span><label class="sw"><input type="checkbox" id="f-all"${d.allDay ? ' checked' : ''}><i></i></label></div>
      <div class="row"><span>시작</span><span class="sp"></span><span class="pair"><input type="date" id="f-sd" value="${d.sd}"><input class="timed" type="time" id="f-st" value="${d.st}"></span></div>
      <div class="row"><span>종료</span><span class="sp"></span><span class="pair"><input type="date" id="f-ed" value="${d.ed}"><input class="timed" type="time" id="f-et" value="${d.et}"></span></div>
    </div>
    <div class="row">${ic.calL}<span>캘린더</span><span class="sp"></span><span class="val"><i class="cdot" id="f-cdot" style="background:${c.color}"></i><span id="f-cname">${esc(c.name)}</span>${udIcon}</span><select id="f-cal">${calOpts}</select></div>
    <div class="row">${ic.bell}<span>알림</span><span class="sp"></span><span class="val"><span id="f-aname">${alertName(d.alert)}</span>${udIcon}</span><select id="f-alert">${alOpts}</select></div>
    <div class="card"><textarea id="f-notes" placeholder="메모">${esc(d.notes)}</textarea></div>
    ${isNew ? '' : `<div class="row del" data-act="delEv" data-id="${d.id}">이벤트 삭제</div>`}</div>`, bindForm);
  if (isNew) setTimeout(() => { const t = $('#f-title'); if (t) t.focus({ preventScroll: true }); }, 380);
}
function bindForm() {
  const g = id => document.getElementById(id);
  let prev = absMin(g('f-sd').value || S.sel, g('f-st').value || '09:00');
  g('f-all').addEventListener('change', e => g('when').classList.toggle('allday-on', e.target.checked));
  const shift = () => {
    const sd = g('f-sd').value, st = g('f-st').value || '09:00';
    if (!sd) return;
    const ns = absMin(sd, st);
    const ed = g('f-ed').value || sd, et = g('f-et').value || st;
    const ne = absMin(ed, et) + (ns - prev); prev = ns;
    const r = fromAbs(ne); g('f-ed').value = r.k; g('f-et').value = r.t;
  };
  g('f-sd').addEventListener('change', shift); g('f-st').addEventListener('change', shift);
  g('f-cal').addEventListener('change', e => { const c = calOf(e.target.value); g('f-cname').textContent = c.name; g('f-cdot').style.background = c.color; });
  g('f-alert').addEventListener('change', e => { g('f-aname').textContent = alertName(e.target.value); });
}
function saveForm() {
  const g = id => document.getElementById(id); if (!g('f-title')) return;
  const id = g('eform').dataset.id;
  const allDay = g('f-all').checked;
  let sd = g('f-sd').value || S.sel, ed = g('f-ed').value || sd;
  let st = g('f-st').value || '09:00', et = g('f-et').value || '10:00';
  if (allDay) { if (ed < sd) ed = sd; }
  else if (absMin(ed, et) < absMin(sd, st)) { ed = sd; et = fromMin(Math.min(1439, toMin(st) + 60)); if (toMin(et) <= toMin(st)) et = st; }
  const obj = { id: id || uid(), title: g('f-title').value.trim() || '새로운 이벤트', loc: g('f-loc').value.trim(), notes: g('f-notes').value.trim(), allDay, sd, st, ed, et, cal: g('f-cal').value, alert: g('f-alert').value };
  const i = S.events.findIndex(e => e.id === obj.id);
  if (i >= 0) S.events[i] = obj; else S.events.push(obj);
  save(); S.sel = sd; closeSheet(); render();
}
function deleteEvent(id) {
  if (!confirm('이 이벤트를 삭제할까요?')) return;
  S.events = S.events.filter(e => e.id !== id); save(); closeSheet(); render();
}

function searchSheet() {
  S.sheet = { type: 'search' };
  openSheet(`<div class="shead"><div class="sbox">${ic.search}<input id="q" type="search" placeholder="이벤트 검색" autocomplete="off"></div><button class="pill txt" data-act="closeSheet" style="box-shadow:none">취소</button></div>
    <div class="sbody" id="results"><div class="empty-msg">검색어를 입력하세요</div></div>`, sh => {
    const q = sh.querySelector('#q'), out = sh.querySelector('#results');
    q.addEventListener('input', () => {
      const t = q.value.trim().toLowerCase();
      if (!t) { out.innerHTML = '<div class="empty-msg">검색어를 입력하세요</div>'; return; }
      const r = S.events.filter(e => isVis(e) && [e.title, e.notes, e.loc, calOf(e.cal).name].join('\n').toLowerCase().includes(t)).sort((a, b) => a.sd.localeCompare(b.sd) || a.st.localeCompare(b.st)).slice(0, 200);
      out.innerHTML = r.length ? `<div class="res">${r.map(e => `<div class="li" data-act="openEv" data-id="${e.id}"><i style="background:${calOf(e.cal).color}"></i><div><b>${esc(e.title)}</b><small>${fmtShort(e.sd)}${e.allDay ? ' · 하루 종일' : ' · ' + fmtTime(e.st)}${e.loc ? ' · ' + esc(e.loc) : ''}</small></div></div>`).join('')}</div>` : '<div class="empty-msg">결과 없음</div>';
    });
    setTimeout(() => q.focus({ preventScroll: true }), 380);
  });
}

function calsSheet() {
  S.sheet = { type: 'cals' };
  const row = c => `<div class="crow"><button class="ck" data-act="calToggle" data-id="${c.id}" style="border-color:${c.color};background:${S.hidden.includes(c.id) ? 'transparent' : c.color}" aria-label="표시 전환">${S.hidden.includes(c.id) ? '' : ic.check}</button><input type="text" data-calname="${c.id}" value="${esc(c.name)}" maxlength="30"><input type="color" data-calcolor="${c.id}" value="${c.color}">${S.cals.length > 1 ? `<button class="rm" data-act="calDel" data-id="${c.id}">삭제</button>` : ''}</div>`;
  openSheet(`${sheetHead('<span style="font-size:19px;font-weight:700;align-self:center;margin-right:auto;margin-left:6px">캘린더</span><button class="pill txt" data-act="closeSheet" style="font-weight:600">완료</button>')}
    <div class="sbody"><div class="sec">내 캘린더</div><div class="res">${S.cals.map(row).join('')}</div>
    <div class="sec" style="margin-top:22px">공휴일</div><div class="res"><div class="crow"><button class="ck" data-act="calToggle" data-id="holiday" style="border-color:${HOL};background:${S.hidden.includes('holiday') ? 'transparent' : HOL}">${S.hidden.includes('holiday') ? '' : ic.check}</button><span style="flex:1;font-size:17px">대한민국 공휴일</span></div></div>
    <button class="addc" data-act="calAdd">캘린더 추가…</button></div>`, sh => {
    sh.querySelectorAll('[data-calname]').forEach(i => i.addEventListener('change', () => { const c = calOf(i.dataset.calname); c.name = i.value.trim() || c.name; i.value = c.name; save(); render(); }));
    sh.querySelectorAll('[data-calcolor]').forEach(i => i.addEventListener('change', () => { calOf(i.dataset.calcolor).color = i.value; save(); calsSheet(); render(); }));
  });
}
function inboxSheet() {
  S.sheet = { type: 'inbox' };
  openSheet(`${sheetHead('<span style="font-size:19px;font-weight:700;align-self:center;margin-right:auto;margin-left:6px">받은 편지함</span>')}<div class="sbody"><div class="empty-msg">받은 초대가 없습니다</div></div>`);
}

/* ---------- toast & alerts ---------- */
let toastT;
function toast(title, sub) {
  const t = $('#toast'); t.innerHTML = `<b>${esc(title)}</b>${esc(sub)}`; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 5000);
}
function checkAlerts() {
  const n = kstNow(), na = absMin(n.key, `${pad(n.h)}:${pad(n.mi)}`);
  S.events.forEach(e => {
    if (e.alert === 'none') return;
    const trig = absMin(e.sd, e.allDay ? '09:00' : e.st) - Number(e.alert), fk = e.id + ':' + trig;
    if (na >= trig && na < trig + 2 && !S.fired[fk]) {
      S.fired[fk] = 1; save();
      toast(e.title, e.alert === '0' ? '지금 시작합니다' : alertName(e.alert).replace('전', '후 시작'));
    }
  });
}
function tick() {
  const n = kstNow(); $('#sb-time').textContent = `${n.h % 12 || 12}:${pad(n.mi)}`;
  const nl = $('#nowline'); if (nl) nl.style.top = (TOP + (n.h * 60 + n.mi) * HH / 60) + 'px';
  checkAlerts();
}

/* ---------- events ---------- */
function openEv(id) {
  const e = S.events.find(x => x.id === id); if (!e) return;
  detailSheet(id);
}
document.addEventListener('click', ev => {
  if (Date.now() - swipeAt < 350) return;
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  switch (a) {
    case 'toYear': setView('year'); break;
    case 'toMonth': setView('month'); break;
    case 'toList': S.prev = S.view; setView('list'); break;
    case 'backList': setView(S.prev || 'month'); break;
    case 'search': searchSheet(); break;
    case 'add': S.sheet = null; editSheet(newDraft(S.sel)); break;
    case 'today': S.sel = today(); render(); break;
    case 'cals': calsSheet(); break;
    case 'inbox': inboxSheet(); break;
    case 'pickDay': S.sel = d.k; setView('day'); break;
    case 'pickStrip': S.sel = d.k; S.dayTop = $('#dscroll') ? $('#dscroll').scrollTop : null; render(); break;
    case 'pickMonth': {
      const y = +d.y, m = +d.m, t = parseKey(today());
      S.sel = (t.y === y && t.m === m) ? today() : key(y, m, 1); setView('month'); break;
    }
    case 'openEv': openEv(d.id); break;
    case 'closeSheet': closeSheet(); break;
    case 'editEv': { const e = S.events.find(x => x.id === d.id); if (e) editSheet({ ...e }); break; }
    case 'saveEv': saveForm(); break;
    case 'delEv': deleteEvent(d.id); break;
    case 'calToggle': { const i = S.hidden.indexOf(d.id); if (i >= 0) S.hidden.splice(i, 1); else S.hidden.push(d.id); save(); calsSheet(); render(); break; }
    case 'calAdd': S.cals.push({ id: uid(), name: '새 캘린더', color: COLORS[S.cals.length % COLORS.length] }); save(); calsSheet(); break;
    case 'calDel': {
      const c = calOf(d.id);
      if (S.cals.length < 2 || !confirm(`'${c.name}' 캘린더와 포함된 이벤트를 삭제할까요?`)) break;
      S.cals = S.cals.filter(x => x.id !== d.id); S.events = S.events.filter(e => e.cal !== d.id); S.hidden = S.hidden.filter(h => h !== d.id);
      save(); calsSheet(); render(); break;
    }
    default: break;
  }
});
document.addEventListener('dblclick', ev => {
  const h = ev.target.closest('#hours'); if (!h || ev.target.closest('.blk') || S.sheet) return;
  const y = ev.clientY - h.getBoundingClientRect().top - TOP;
  const hr = Math.max(0, Math.min(23, Math.floor(y / HH)));
  editSheet(newDraft(S.sel, hr));
});
$('#backdrop').addEventListener('click', () => { if (S.sheet && S.sheet.type !== 'edit') closeSheet(); });
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && S.sheet) { closeSheet(); return; }
  if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || S.sheet) return;
  if (ev.key === 'ArrowLeft') nav(-1); else if (ev.key === 'ArrowRight') nav(1);
});

/* swipe */
let sx = 0, sy = 0, sActive = false, swipeAt = 0, inStrip = false;
document.addEventListener('pointerdown', e => { if (S.sheet) return; sActive = true; sx = e.clientX; sy = e.clientY; inStrip = !!e.target.closest('#strip'); });
document.addEventListener('pointerup', e => {
  if (!sActive) return; sActive = false;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.6) {
    swipeAt = Date.now();
    const dir = dx < 0 ? 1 : -1;
    if (S.view === 'day' && inStrip) { S.sel = addDays(S.sel, 7 * dir); S.dayTop = $('#dscroll').scrollTop; render(); }
    else { if (S.view === 'day') S.dayTop = $('#dscroll').scrollTop; nav(dir); }
  }
});
document.addEventListener('pointercancel', () => { sActive = false; });
window.addEventListener('resize', () => { if (S.view === 'month') layoutChips(); });

/* ---------- init ---------- */
load();
render();
tick();
setInterval(tick, 15000);
window.__cal = { S, render, kstNow };
})();
</script>
</body>
</html>
