<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>카카오톡</title>
<link rel="stylesheet" href="../css/kakaotalk.css">

<body>
<div id="app">
  <div id="sb"><span class="tm" id="clock">9:41</span>
    <div class="ri">
      <svg width="18" height="13" viewBox="0 0 18 13" fill="#111"><path d="M9 2.5c2.3 0 4.4.9 6 2.4l1.3-1.4A10.9 10.9 0 0 0 9 .6C6.1.6 3.5 1.7 1.7 3.5L3 4.9a8.7 8.7 0 0 1 6-2.4zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.3-1.4A7.2 7.2 0 0 0 9 4.2c-1.9 0-3.600.7-4.700 1.800l1.300 1.400c.9-.8 2.100-1.300 3.400-1.300zm0 3.500c-.7 0-1.300.3-1.800.7L9 12.200l1.800-1.900c-.5-.4-1.100-.7-1.800-.7z"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.500" fill="none" stroke="#111" opacity=".4"/><rect x="2" y="2" width="17" height="9" rx="2" fill="#111"/><rect x="25" y="4.500" width="1.600" height="4" rx=".8" fill="#111" opacity=".4"/></svg>
    </div>
  </div>

  <section class="scr on" id="list">
<div class="wrap">
    <div class="lh"><div id="me"></div><span class="nm">박성화</span>
      <button data-i="search"></button><button data-i="addf"></button><button data-i="gear"></button></div>
    <div class="pills"><button class="pill k">친구</button><button class="pill">소식</button></div>
    <div class="sc" id="lsc"></div>
</div>
    <div class="tabs" data-tabs="0"></div>
  </section>


  <section class="scr" id="chatlist">
<div class="wrap">
    <div class="lh"><span class="nm" style="margin:0;font-size:24px">채팅</span>
      <button data-i="search"></button><button data-i="newc"></button><button data-i="gear"></button></div>
    <div class="pills" id="clp"></div>
    <div class="sc" id="clsc"></div>
</div>
    <div class="tabs" data-tabs="1"></div>
  </section>

  <section class="scr" id="profile">
    <div class="top">
      <div class="gl c"><button id="pclose" data-i="close"></button></div>
      <div class="gl"><button id="pstar" data-i="star"></button><button data-i="dots"></button></div>
    </div>
    <div id="pscroll"></div>
  </section>

  <section class="scr" id="chat">
    <div class="ch-h">
      <div class="gl"><button class="bk" id="cback"><span data-i="back" style="width:22px;height:22px"></span><span id="bkn">3</span></button></div>
      <div class="ti" id="ctitle"></div>
      <div class="gl"><button data-i="search"></button><button data-i="phone"></button><button data-i="menu"></button></div>
    </div>
    <div id="msgs"></div>
    <div id="tray"></div>
    <div class="inp">
      <button class="ib" id="plus" data-i="plus"></button>
      <input id="ti" placeholder="메시지 입력" autocomplete="off">
      <button class="ib g" id="emo" data-i="smile"></button>
      <button class="ib" id="rgt"></button>
    </div>
  </section>
</div>

<script src="../js/kakaotalk.js"></script>

</html>
