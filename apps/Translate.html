<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>번역</title>
<link rel="stylesheet" href="../css/translate.css">
<script src="../shared/system-bar.js"></script></head>
<body>
<div id="app">

<!-- 번역 -->
<section class="screen on" id="s-tr">
  <div class="top">
    <button class="circ" id="btnFavList" aria-label="즐겨찾기"><svg width="30" height="26" viewBox="0 0 30 26"><path fill="#000" d="M3 2l1 2.2 2.4.3-1.8 1.6.5 2.4L3 7.2 .9 8.5l.5-2.4L-.4 4.500 2 4.2z" transform="translate(1 0)"/><path fill="#000" d="M3 10l1 2.2 2.4.3-1.8 1.6.5 2.4L3 15.200 .9 16.500l.5-2.400L-.4 12.500 2 12.200z" transform="translate(1 0)"/><path fill="#000" d="M3 18l1 2.2 2.4.3-1.8 1.6.5 2.4L3 23.200 .9 24.500l.5-2.400L-.4 20.500 2 20.200z" transform="translate(1 -1)"/><g stroke="#000" stroke-width="2.4" stroke-linecap="round"><path d="M11 5h16M11 13h16M11 21h16"/></g></svg></button>
    <button class="circ" id="btnMore" aria-label="더보기"><svg width="28" height="8"><g fill="#000"><circle cx="4" cy="4" r="3"/><circle cx="14" cy="4" r="3"/><circle cx="24" cy="4" r="3"/></g></svg></button>
  </div>
  <div class="body">
    <h1>번역</h1>
    <div class="card" style="padding:26px 30px 30px">
      <div class="half">
        <button class="lang" data-pick="src"><span id="srcName"></span><span class="chev"></span></button>
        <div class="row"><textarea id="srcText" rows="3"></textarea><button id="micSrc" aria-label="음성 입력"></button></div>
      </div>
      <div class="divider"><button class="swap" id="btnSwap" aria-label="언어 전환"></button></div>
      <div class="half">
        <button class="lang t" data-pick="tgt"><span id="tgtName"></span><span class="chev t"></span></button>
        <div class="row"><div class="out ph" id="tgtOut"></div><button id="micTgt" aria-label="음성 입력"></button></div>
      </div>
    </div>
  </div>
</section>

<!-- 카메라: 눌러도 아무 동작 없음 (화면 없음) -->

<!-- 대화 -->
<section class="screen" id="s-cv">
  <div class="top">
    <button class="pill" id="btnView">보기</button>
    <div style="font-size:21px;font-weight:700">대화</div>
    <button class="circ" id="btnMore2" aria-label="더보기"><svg width="28" height="8"><g fill="#000"><circle cx="4" cy="4" r="3"/><circle cx="14" cy="4" r="3"/><circle cx="24" cy="4" r="3"/></g></svg></button>
  </div>
  <div class="chatwrap" id="chat"><div id="msgs"></div>
  <div class="conv">
    <div class="ic">
      <div class="inp r"><button class="lang" data-pick="src"><span id="cvSrcName"></span><span class="chev"></span></button><textarea id="cvSrc" rows="1"></textarea></div>
      <div class="inp l"><button class="lang" data-pick="tgt"><span id="cvTgtName"></span><span class="chev"></span></button><textarea id="cvTgt" rows="1"></textarea></div>
    </div>
    <button class="mic" id="cvMic" aria-label="마이크"><svg width="34" height="44" viewBox="0 0 34 44" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><rect x="10" y="2" width="14" height="25" rx="7" fill="#fff"/><path d="M3 20c0 8 6 13 14 13s14-5 14-13M17 33v8M10 41h14"/></svg></button>
  </div></div>
</section>

<div class="nav">
  <div class="tabbar">
    <button class="tab on" data-tab="tr"><svg width="42" height="38" viewBox="0 0 42 38"><path d="M4 4h20a3 3 0 013 3v14a3 3 0 01-3 3H13l-6 5v-5H4a3 3 0 01-3-3V7a3 3 0 013-3z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 18l5-11 5 11M10 14h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M22 14h14a4 4 0 014 4v10a4 4 0 01-4 4h-2v4l-5-4h-7a4 4 0 01-4-4V18a4 4 0 014-4z" fill="currentColor"/><text x="31" y="29" font-size="11" font-weight="800" fill="#fff" text-anchor="middle">文</text></svg>번역</button>
    <button class="tab" id="camTab" aria-label="카메라"><svg width="42" height="38" viewBox="0 0 42 38"><path d="M4 12a4 4 0 014-4h4l3-4h12l3 4h4a4 4 0 014 4v16a4 4 0 01-4 4H8a4 4 0 01-4-4z" fill="currentColor"/><circle cx="21" cy="20" r="7.500" fill="#fff"/><circle cx="21" cy="20" r="4.500" fill="currentColor"/></svg>카메라</button>
    <button class="tab" data-tab="cv"><svg width="42" height="38" viewBox="0 0 42 38"><g fill="currentColor"><circle cx="13" cy="11" r="6"/><circle cx="29" cy="9" r="6"/><path d="M1 32c0-7 5-11 12-11s12 4 12 11v2H1z"/><path d="M26 22c8-1 15 3 15 10v2H28c1-4 0-9-2-12z"/></g></svg>대화</button>
  </div>
</div>
</div>

<!-- 즐겨찾기 시트 -->
<div class="sheet" id="favSheet">
  <div class="top"><button class="circ" id="favClose" aria-label="닫기"><svg width="26" height="26" viewBox="0 0 26 26" stroke="#000" stroke-width="2.600" stroke-linecap="round"><path d="M3 3l20 20M23 3L3 23"/></svg></button></div>
  <div class="body" id="favBody" style="padding-top:6px"></div>
</div>

<!-- 언어 선택 -->
<div class="modal" id="langModal">
  <div class="panel">
    <div class="hd"><span id="langTitle">언어 선택</span><button class="done" id="langDone">완료</button></div>
    <input id="langSearch" placeholder="검색" autocomplete="off">
    <div class="list" id="langList"></div>
  </div>
</div>

<!-- 더보기 메뉴 -->
<div class="menu" id="menu">
  <button id="mClear">입력 지우기</button>
  <button id="mCopy">번역 결과 복사</button>
  <button id="mHist">번역 기록 보기</button>
  <button id="mReset">대화 기록 삭제</button>
</div>
<div class="toast" id="toast"></div>

<script src="../js/translate.js"></script>
</body>
</html>
