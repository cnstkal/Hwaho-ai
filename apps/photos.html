 linear-gradient(to right,transparent calc(33.333% - .5px),rgba(255,255,255,.45) calc(33.333% - .5px) calc(33.333% + .5px),transparent calc(33.333% + .5px) calc(66.666% - .5px),rgba(255,255,255,.45) calc(66.666% - .5px) calc(66.666% + .5px),transparent calc(66.666% + .5px)),

/* Hwaho2 stability guard: isolated recovery, image fallback, safe storage parsing. */
(() => {
  "use strict";
  const appByScript = [
    ["instagram.js", "ig-app"], ["twitter.js", "x-app"], ["safari.js", "saf-app"],
    ["photos.js", "pho-app"], ["chatgpt.js", "gp-app"], ["spotify.js", "sp-app"],
    ["kakaotalk.js", "kko-app"], ["notes.js", "nt-app"], ["youtube.js", "yt-app"],
    ["netflix.js", "nf-app"], ["baemin.js", "bm-app"], ["fromm.js", "fm-app"], ["fromm-app.js", "fm-app"],
    ["everytime.js", "et-app"], ["calendar.js", "cal-app"], ["imessage.js", "msg-app"],
    ["phone.js", "tel-app"], ["clock.js", "clk-app"], ["karrot.js", "dg-app"],
    ["albamon.js", "am-app"]
  ];
  const root = document.getElementById("screen");
  const home = document.getElementById("home");
  function recover(id, reason) {
    const layer = document.getElementById(id);
    if (!layer) return;
    const currentByLayer = {"ig-app":"instagram","x-app":"x","saf-app":"safari","pho-app":"photos","cam-app":"camera","gp-app":"chatgpt","sp-app":"spotify","kko-app":"kakaotalk","nt-app":"notes","yt-app":"youtube","nf-app":"netflix","bm-app":"baemin","fm-app":"fromm","et-app":"everytime","cal-app":"calendar","msg-app":"messages","tel-app":"phone","clk-app":"clock","dg-app":"danggeun","am-app":"albamon"};
    if (!window.Home || window.Home.current !== currentByLayer[id]) {
      console.error("[Hwaho stability] Background app error:", id, reason);
      return;
    }
    console.error("[Hwaho stability] App isolated:", id, reason);
    layer.setAttribute("aria-hidden", "true");
    layer.style.pointerEvents = "none";
    layer.style.display = "none";
    layer.classList.remove("open", "show", "on", "active", "opening", "in-app");
    const appId = currentByLayer[id];
    if (window.Home && window.Home.current === appId) {
      window.Home.current = null;
      try { localStorage.removeItem("hwaho-last-screen-v1"); } catch (_) {}
      if (home) {
        home.style.display = "flex";
        home.style.opacity = "1";
        home.style.transform = "none";
        home.style.pointerEvents = "auto";
      }
    }
  }
  window.addEventListener("error", event => {
    if (event.target && event.target.tagName === "IMG") return;
    const file = String(event.filename || "");
    const match = appByScript.find(([name]) => file.includes(name));
    if (match) {
      const id = file.includes("photos.js") && window.Home && window.Home.current === "camera" ? "cam-app" : match[1];
      recover(id, event.message || "runtime error");
    }
  }, true);
  window.addEventListener("unhandledrejection", event => {
    const current = window.Home && window.Home.current;
    const map = {
      instagram: "ig-app", x: "x-app", safari: "saf-app", photos: "pho-app", camera: "cam-app",
      chatgpt: "gp-app", spotify: "sp-app", kakaotalk: "kko-app", notes: "nt-app",
      youtube: "yt-app", netflix: "nf-app", baemin: "bm-app", fromm: "fm-app",
      everytime: "et-app", calendar: "cal-app", messages: "msg-app", phone: "tel-app",
      clock: "clk-app", danggeun: "dg-app", albamon: "am-app"
    };
    if (current && map[current]) recover(map[current], event.reason || "unhandled rejection");
  });
  const fallback = "data:image/svg+xml," + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="8" fill="#eeeeef"/><rect x="13" y="15" width="38" height="34" rx="4" fill="none" stroke="#a1a1aa" stroke-width="3"/><circle cx="24" cy="26" r="4" fill="#a1a1aa"/><path d="M16 44l12-12 8 8 5-5 7 9" fill="none" stroke="#a1a1aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>');
  function tuneImage(img) {
    if (!img || img.tagName !== "IMG") return;
    if (!img.hasAttribute("decoding")) img.decoding = "async";
    if (img.closest("[id$='-app']") && !img.hasAttribute("loading")) img.loading = "lazy";
  }
  function tuneImages(scope) {
    if (!scope || !scope.querySelectorAll) return;
    if (scope.tagName === "IMG") tuneImage(scope);
    scope.querySelectorAll("img").forEach(tuneImage);
  }
  if (root) {
    tuneImages(root);
    new MutationObserver(records => {
      for (const record of records) for (const node of record.addedNodes) {
        if (node.nodeType === 1) {
          if (node.tagName === "IMG") tuneImage(node);
          else tuneImages(node);
        }
      }
    }).observe(root, { childList: true, subtree: true });
    root.addEventListener("error", event => {
      const img = event.target;
      if (!img || img.tagName !== "IMG" || img.dataset.hwahoFallback) return;
      img.dataset.hwahoFallback = "1";
      img.src = fallback;
    }, true);
  }
  window.HwahoStability = {
    readJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (raw == null) return fallback;
        try {
          const value = JSON.parse(raw);
          const valid = {
            "ios-insta-v1": v => v && typeof v === "object" && v.like && typeof v.like === "object",
            "ios-x-v2": v => v && typeof v === "object" && !Array.isArray(v),
            "ios-safari-v1": v => v && Array.isArray(v.tabs) && v.tabs.length > 0,
            "ios-chatgpt-v1": v => v && Array.isArray(v.chats),
            "ios-spotify-v1": v => v && Array.isArray(v.liked),
            "ios-spotify-playback-v1": v => v && Array.isArray(v.Q),
            "ios-kakao-v5": v => v && Array.isArray(v.chats) && Array.isArray(v.friends),
            "nt.notes.v1": v => Array.isArray(v),
            "nt.folders.v1": v => Array.isArray(v),
            "nt.att.v1": v => v && typeof v === "object" && !Array.isArray(v),
            "nt.tags.v1": v => Array.isArray(v),
            "nt.prefs.v1": v => v && typeof v === "object" && !Array.isArray(v)
          }[key];
          if (!valid || valid(value)) return value;
        } catch (_) {}
        try { sessionStorage.setItem("hwaho-recovery:" + key, raw); } catch (_) {}
        console.warn("[Hwaho stability] Invalid saved data preserved for this session:", key);
        return fallback;
      } catch (_) { return fallback; }
    },
    writeJSON(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); return true; }
      catch (error) { console.warn("[Hwaho stability] Save failed; previous data retained:", key, error); return false; }
    }
  };
})();
}

{
/* ===== home.js (integrated) ===== */
/**
 * 홈 화면 설정 — 아이콘/배경 교체는 이 파일만 수정하면 됩니다.
 *
 * 아이콘 이미지로 교체: 앱 항목에 `img: "icons/kakaotalk.png"` 추가 (정사각형 PNG, 모서리는 자동 마스킹).
 * 배경 이미지로 교체: WALLPAPER 에 "url(wallpapers/bg.jpg)" 지정.
 */
window.WALLPAPER = "url(images/wallpapers/PlanKim-iOS-18-Wallpaper-Blue-Light.jpg)"; // 홈 화면과 잠금 화면 공통 배경

const g = (id, a, b) => `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="60" height="60" fill="url(#${id})"/>`;

window.APPS = {
  grid: [
    { id: "photos", label: "사진", img: "images/app/Photos/photos.svg", svg:
      `<rect width="60" height="60" fill="#fff"/><g style="mix-blend-mode:multiply"><ellipse cx="30" cy="19" rx="6.500" ry="11" fill="#ffcc00"/><ellipse cx="30" cy="19" rx="6.500" ry="11" fill="#ff9500" transform="rotate(45 30 30)"/><ellipse cx="30" cy="19" rx="6.500" ry="11" fill="#ff3b30" transform="rotate(90 30 30)"/><ellipse cx="30" cy="19" rx="6.500" ry="11" fill="#ff2d92" transform="rotate(135 30 30)"/><ellipse cx="30" cy="19" rx="6.500" ry="11" fill="#af52de" transform="rotate(180 30 30)"/><ellipse cx="30" cy="19" rx="6.500" ry="11" fill="#007aff" transform="rotate(225 30 30)"/><ellipse cx="30" cy="19" rx="6.500" ry="11" fill="#32ade6" transform="rotate(270 30 30)"/><ellipse cx="30" cy="19" rx="6.500" ry="11" fill="#34c759" transform="rotate(315 30 30)"/></g>` }
  ],
  dock: [],
};

(() => {
  const $ = (s) => document.querySelector(s);
  const DOW = ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];

  /* ---------- 확대 방지 ---------- */
  ["gesturestart","gesturechange","gestureend"].forEach(e => document.addEventListener(e, ev => ev.preventDefault(), { passive: false }));
  document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("touchmove", e => { if (e.touches.length > 1 || e.scale && e.scale !== 1) e.preventDefault(); }, { passive: false });

  /* ---------- 배경 ---------- */
  if (window.WALLPAPER) $("#wallpaper").style.setProperty("background", window.WALLPAPER + " center/cover no-repeat");

  /* ---------- 앱 렌더 ---------- */
  function iconInner(app) {
    if (app.img) return `<img src="${app.img}" alt="" draggable="false">`;
    if (app.dynamic === "calendar") {
      const d = new Date(2026, 9, 19);
      return `<div class="cal"><span class="dow">${DOW[d.getDay()]}</span><span class="day">${d.getDate()}</span></div>`;
    }
    return `<svg viewBox="0 0 60 60" preserveAspectRatio="xMidYMid slice">${app.svg}</svg>`;
  }
  function renderApps(list, mount) {
    mount.innerHTML = "";
    list.forEach(app => {
      const el = document.createElement("div");
      el.className = "app"; el.dataset.app = app.id; el.setAttribute("role", "button"); el.setAttribute("aria-label", app.label);
      el.innerHTML = `<div class="icon">${iconInner(app)}</div><span class="label">${app.label}</span>`;
      mount.appendChild(el);
    });
  }
  // 에브리타임은 앱 데이터와 구현을 유지한 채 홈 화면에서만 숨김 처리합니다. 다시 활성화하려면 필터에서 every time 제외 조건을 제거하세요.
  const HIDDEN_HOME_APPS = new Set(["everytime"]);
  const render = () => {
    renderApps(APPS.grid.filter(app => !HIDDEN_HOME_APPS.has(app.id)), $("#grid"));
    renderApps(APPS.dock, $("#dock"));
  };
  render();

  /* ---------- 앱 열기/홈 복귀 훅 (앱 UI는 추후 구현) ---------- */

  const HOME_STATE_KEY = "hwaho-last-screen-v1";
  let closeTimer = null;
  const Home = {
    current: null,
    openApp(id) {
      if (!id || Home.current === id) return;
      if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
      // Clear any stale invisible app layers left behind by a previous home-indicator gesture.
      document.querySelectorAll("#screen [id$='-app']").forEach(app => {
        app.style.pointerEvents = "";
        if (app.getAttribute("aria-hidden") === "true") app.removeAttribute("aria-hidden");
        app.style.display = "";
      });
      const previous = Home.current;
      if (previous && previous !== id) document.dispatchEvent(new CustomEvent("app:close", { detail: { id: previous, next: id } }));
      const h = $("#home");
      h.style.display = "";
      h.style.pointerEvents = "";
      Home.current = id;
      try { localStorage.setItem(HOME_STATE_KEY, id); } catch (_) {}
      document.dispatchEvent(new CustomEvent("app:open", { detail: { id } }));
      if (id === "instagram" && window.IgApp) window.IgApp.open();
    },
    goHome() {
      if (closeTimer) return;
      const had = Home.current; Home.current = null;
      try { localStorage.removeItem(HOME_STATE_KEY); } catch (_) {}
      document.dispatchEvent(new CustomEvent("app:close", { detail: { id: had } }));
      const h = $("#home");
      h.style.display = "flex";
      h.style.opacity = "1";
      h.style.transform = "none";
      h.style.pointerEvents = "auto";
      h.classList.remove("returning"); void h.offsetWidth; h.classList.add("returning");
      // After the closing animation, fully deactivate every app layer so it cannot block later taps.
      closeTimer = setTimeout(() => {
        closeTimer = null;
        if (Home.current !== null) return;
        document.querySelectorAll("#screen [id$='-app']").forEach(app => {
          app.classList.remove("open", "show", "on", "active", "opening", "in-app");
          app.setAttribute("aria-hidden", "true");
          app.style.pointerEvents = "none";
          app.style.display = "none";
        });
        h.style.display = "flex";
        h.style.pointerEvents = "auto";
      }, 460);
    },
    refresh: render,
  };
  window.Home = Home;

  /* ---------- 아이콘 터치 피드백 / 탭 ---------- */
  let pressed = null, moved = false, sx = 0, sy = 0;
  document.addEventListener("pointerdown", e => {
    const a = e.target.closest(".app"); if (!a) return;
    pressed = a; moved = false; sx = e.clientX; sy = e.clientY; a.classList.add("pressed");
  });
  document.addEventListener("pointermove", e => {
    if (pressed && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) { moved = true; pressed.classList.remove("pressed"); }
  });
  const release = e => {
    if (!pressed) return;
    const a = pressed; pressed = null; a.classList.remove("pressed");
    if (!moved && e.type === "pointerup") Home.openApp(a.dataset.app);
  };
  document.addEventListener("pointerup", release);
  document.addEventListener("pointercancel", release);

  /* ---------- 가벼운 홈 인디케이터: 위로 쓸면 홈으로 ---------- */
  const homeZone = $("#home-indicator-zone");
  let homeTouch = null;
  homeZone.addEventListener("pointerdown", e => {
    homeTouch = { y: e.clientY, x: e.clientX, id: e.pointerId };
    try { homeZone.setPointerCapture(e.pointerId); } catch (_) {}
  });
  homeZone.addEventListener("pointerup", e => {
    if (!homeTouch) return;
    const dy = homeTouch.y - e.clientY;
    const dx = Math.abs(homeTouch.x - e.clientX);
    const distance = Math.hypot(dx, dy);
    homeTouch = null;
    if (!Home.current) return;
    // 탭하면 즉시 홈으로, 위로 쓸어도 홈으로
    if (distance < 14 || (dy > 18 && dy > dx * 0.8)) Home.goHome();
  });
  homeZone.addEventListener("pointercancel", () => { homeTouch = null; });
  homeZone.addEventListener("click", e => { if (Home.current) { e.preventDefault(); e.stopPropagation(); Home.goHome(); } });
  /* 하단 인디케이터가 앱 레이어에 가려져도 문서 캡처 단계에서 홈 복귀 처리 */
  let lastHomeAction = 0;
  const homeFromBottomGesture = e => {
    if (!e.isTrusted) return;
    const p = e.changedTouches ? e.changedTouches[0] : e;
    if (!p) return;
    const r = $("#screen").getBoundingClientRect();
    const x = p.clientX - r.left, y = p.clientY - r.top;
    const nearIndicator = y >= r.height - 34 && Math.abs(x - r.width / 2) <= 75;
    if (!nearIndicator || Date.now() - lastHomeAction < 500) return;
    lastHomeAction = Date.now();
    // Home.current가 비어 있어도 모든 앱에 app:close를 보내 강제로 홈 복귀
    Home.goHome();
    document.querySelectorAll("#screen [id$='-app']").forEach(app => {
      app.classList.remove("on", "active", "opening");
      if (app.id !== "home") app.style.display = "none";
    });
    $("#home").style.display = "flex";
    $("#home").style.opacity = "1";
    $("#home").style.transform = "none";
    $("#home").style.pointerEvents = "auto";
  };
  document.addEventListener("pointerup", homeFromBottomGesture, true);
  document.addEventListener("touchend", homeFromBottomGesture, { capture: true, passive: true });

  /* ---------- 시계 ---------- */
  /* 스토리 시계: 날짜는 2026-10-19 고정, 시각은 스토리 이벤트 기준점에서 실시간으로 흐른다 (새로고침 후에도 유지) */
  const CK = "hwaho-story-clock-abs-v1", DAY = 86400000;
  const dayMs = () => { const n = new Date(); return n.getTime() - new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime(); };
  let ckOff = null; try { const v = localStorage.getItem(CK); if (v !== null && v !== "") ckOff = Number(v); } catch (e) {}
  const ckSet = (h, m, s = 0) => { ckOff = (h * 3600 + m * 60 + s) * 1000; try { localStorage.setItem(CK, String(ckOff)); } catch (e) {} document.dispatchEvent(new CustomEvent("story:clock")); };
  if (ckOff === null || isNaN(ckOff)) ckSet(14, 25, 0); /* 스토리 시작 시각 (오후 2:25) */
  const ckNow = () => new Date(new Date(2026, 9, 19).getTime() + ((((ckOff) % DAY) + DAY) % DAY));
  window.HwahoClock = { now: ckNow, set: ckSet, hm() { const d = ckNow(); return [d.getHours(), d.getMinutes()]; }, label() { const d = ckNow(); return (d.getHours() < 12 ? "오전 " : "오후 ") + (d.getHours() % 12 || 12) + ":" + String(d.getMinutes()).padStart(2, "0"); } };
  let lastDay = 19, tickT = 0;
  function tick() {
    clearTimeout(tickT);
    const d = ckNow();
    $("#clock").textContent = `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, "0")}`;
    if (d.getDate() !== lastDay) { lastDay = d.getDate(); render(); }
    tickT = setTimeout(tick, 60000 - d.getSeconds() * 1000 - d.getMilliseconds() + 20);
  }
  document.addEventListener("story:clock", tick);
  tick();

  /* ---------- 배터리 ---------- */
  const bat = { level: 1, charging: false, linked: false }, batBox = document.querySelector(".sb-battery");
  const paintBat = () => {
    const p = Math.round(bat.level * 100);
    $("#bat-level").style.width = Math.max(8, p) + "%";
    batBox.classList.toggle("low", p <= 20 && !bat.charging);
    batBox.classList.toggle("charging", bat.charging);
    batBox.setAttribute("aria-label", bat.linked
      ? "배터리 " + p + "%" + (bat.charging ? ", 충전 중" : "")
      : "배터리 상태는 이 브라우저에서 연동할 수 없음");
    batBox.dataset.linked = bat.linked ? "true" : "false";
  };
  Home.battery = { get: () => ({ level: bat.level, charging: bat.charging, linked: bat.linked }) };
  paintBat();
  // Battery Status API가 지원되는 브라우저에서만 실제 기기 배터리와 연동합니다.
  // 지원되지 않으면 충전 아이콘을 탭해서 가짜로 바뀌게 하지 않습니다.
  if (typeof navigator.getBattery === "function") {
    navigator.getBattery().then(b => {
      const up = () => {
        bat.level = b.level;
        bat.charging = b.charging;
        bat.linked = true;
        paintBat();
      };
      up();
      b.addEventListener("levelchange", up);
      b.addEventListener("chargingchange", up);
    }).catch(() => { bat.linked = false; paintBat(); });
  }
})();

}

/* ===== 미디어 저장소 (사진/동영상 공유: 카메라 → 사진 앱) ===== */
const Media = (() => {
  const mem = { meta: [], blob: {}, seq: 1 };
  let db = null, ready = null;
  const fire = () => document.dispatchEvent(new CustomEvent("media:change"));
  const init = () => ready || (ready = new Promise(res => {
    try {
      const r = indexedDB.open("ioshome-media", 1);
      r.onupgradeneeded = () => { const d = r.result; d.createObjectStore("meta", { keyPath: "id", autoIncrement: true }); d.createObjectStore("blob", { keyPath: "id" }); };
      r.onsuccess = () => { db = r.result; res(); };
      r.onerror = r.onblocked = () => res();
    } catch (e) { res(); }
  }));
  const rq = r => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
  return {
    async all() { await init(); return db ? rq(db.transaction("meta").objectStore("meta").getAll()) : mem.meta.slice(); },
    async get(id) { await init(); return db ? rq(db.transaction("blob").objectStore("blob").get(id)) : mem.blob[id]; },
    async add(meta, blob, live) {
      await init(); meta.ts = Date.now();
      if (!db) { meta.id = mem.seq++; mem.meta.push(meta); mem.blob[meta.id] = { blob, live: live || null }; fire(); return meta; }
      return new Promise((ok, no) => {
        const t = db.transaction(["meta", "blob"], "readwrite"), q = t.objectStore("meta").add(meta);
        q.onsuccess = () => { meta.id = q.result; t.objectStore("blob").put({ id: q.result, blob, live: live || null }); };
        t.oncomplete = () => { fire(); ok(meta); };
        t.onerror = t.onabort = () => no(t.error);
      });
    },
    async del(ids) {
      await init(); ids = [].concat(ids);
      if (!db) { mem.meta = mem.meta.filter(m => !ids.includes(m.id)); ids.forEach(i => delete mem.blob[i]); fire(); return; }
      return new Promise((ok, no) => {
        const t = db.transaction(["meta", "blob"], "readwrite");
        ids.forEach(i => { t.objectStore("meta").delete(i); t.objectStore("blob").delete(i); });
        t.oncomplete = () => { fire(); ok(); }; t.onerror = t.onabort = () => no(t.error);
      });
    },
  };
})();

const sleep = ms => new Promise(r => setTimeout(r, ms));

const CameraApp = (() => {
  const $ = s => document.querySelector(s);
  const el = $("#cam-app"), screen = $("#screen");
  const svg = (p, extra = "") => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" ${extra}>${p}</svg>`;
  const BOLT = "M13.200 2.800L6 13.200h5.200l-.7 8L18 10.600h-5.200z";

/* ===== view-only.js ===== */
{
/* ===== view-only.js (integrated) ===== */
/**
 * 보기 전용 모드
 * 앱 화면과 버튼은 볼 수 있지만 텍스트 입력/편집은 허용하지 않습니다.
 */
(() => {
  "use strict";

  const TEXT_INPUT_TYPES = new Set([
    "text", "search", "email", "password", "tel", "url", "number"
  ]);

  /* 트위터 검색 입력창은 입력 허용 */
  const isAllowed = t => t instanceof Element && t.id === "x-q";

  function lockElement(el) {
    if (!(el instanceof HTMLElement) || isAllowed(el)) return;

    if (el instanceof HTMLInputElement && TEXT_INPUT_TYPES.has(el.type)) {
      el.readOnly = true;
      el.setAttribute("aria-readonly", "true");
      el.setAttribute("autocomplete", "off");
      el.setAttribute("autocorrect", "off");
      el.setAttribute("spellcheck", "false");
    } else if (el instanceof HTMLTextAreaElement) {
      el.readOnly = true;
      el.setAttribute("aria-readonly", "true");
      el.setAttribute("spellcheck", "false");
    }

    if (el.isContentEditable || el.hasAttribute("contenteditable")) {
      el.setAttribute("contenteditable", "false");
      el.setAttribute("aria-readonly", "true");
    }
  }

  function lockTree(root) {
    if (!(root instanceof Element || root instanceof Document)) return;
    if (root instanceof Element) lockElement(root);
    root.querySelectorAll?.(
      'input, textarea, [contenteditable]:not([contenteditable="false"])'
    ).forEach(lockElement);
  }

  // 최초 화면과 이후 앱에서 동적으로 생성되는 화면 모두 잠금
  const start = () => {
    lockTree(document);
    new MutationObserver(records => {
      for (const record of records) {
        for (const node of record.addedNodes) {
          if (node instanceof Element) lockTree(node);
        }
      }
    }).observe(document.documentElement, { childList: true, subtree: true });
  };

  // 브라우저가 입력을 반영하기 전 단계에서 편집 동작 차단
  document.addEventListener("beforeinput", event => {
    const target = event.target;
    if (isAllowed(target)) return;
    if (target instanceof HTMLInputElement &&
        TEXT_INPUT_TYPES.has(target.type)) event.preventDefault();
    if (target instanceof HTMLTextAreaElement) event.preventDefault();
    if (target instanceof HTMLElement &&
        (target.isContentEditable || target.closest('[contenteditable="true"]'))) {
      event.preventDefault();
    }
  }, true);

  document.addEventListener("paste", event => {
    if (event.target instanceof HTMLInputElement ||
        event.target instanceof HTMLTextAreaElement ||
        (event.target instanceof HTMLElement &&
         event.target.closest('[contenteditable="true"]'))) {
      event.preventDefault();
    }
  }, true);

  document.addEventListener("drop", event => {
    if (event.target instanceof HTMLInputElement ||
        event.target instanceof HTMLTextAreaElement ||
        (event.target instanceof HTMLElement &&
         event.target.closest('[contenteditable="true"]'))) {
      event.preventDefault();
    }
  }, true);

  // select 메뉴의 키보드 문자 검색 등 텍스트 입력성 키 조작 차단
  document.addEventListener("keydown", event => {
    if (isAllowed(event.target)) return;
    if (event.isComposing) {
      event.preventDefault();
      return;
    }
    const target = event.target;
    const typingTarget =
      target instanceof HTMLInputElement && TEXT_INPUT_TYPES.has(target.type) ||
      target instanceof HTMLTextAreaElement ||
      target instanceof HTMLElement &&
        (target.isContentEditable || target.closest('[contenteditable="true"]'));
    if (typingTarget) {
      if (event.key.length === 1 || event.key === "Backspace" ||
          event.key === "Delete" || event.key === "Enter") {
        event.preventDefault();
      }
    }
  }, true);

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", start, { once: true });
  } else {
    start();
  }
})();

}

/* ===== launch-motion.js ===== */
{
/* Shared app launch animation: observe every app's existing visible/open state. */
(() => {
  const ids = ["cam-app","cal-app","pho-app","msg-app","tel-app","saf-app","kko-app","ig-app","clk-app","x-app","et-app","gp-app","sp-app","fm-app","yt-app","nf-app","dg-app","bm-app","am-app","notes-app","nt-app"];
  const roots = ids.map(id => document.getElementById(id)).filter(Boolean);
  const wasActive = new WeakMap();
  const timers = new WeakMap();
  const active = el => {
    const c = el.classList;
    if (el.id === "notes-app") return c.contains("on");
    return c.contains("show") || c.contains("open") || c.contains("on") || c.contains("active");
  };
  const animate = el => {
    if (!el.isConnected) return;
    clearTimeout(timers.get(el));
    el.classList.remove("hwaho-launching");
    void el.offsetWidth;
    el.classList.add("hwaho-launching");
    const finish = e => {
      if (e.target !== el || e.animationName !== "hwahoFrommStyleLaunch") return;
      el.classList.remove("hwaho-launching");
      el.removeEventListener("animationend", finish);
    };
    el.addEventListener("animationend", finish);
    timers.set(el, setTimeout(() => {
      el.classList.remove("hwaho-launching");
      el.removeEventListener("animationend", finish);
    }, 650));
  };
  const check = el => {
    const now = active(el), before = wasActive.get(el) || false;
    if (now && !before) animate(el);
    wasActive.set(el, now);
  };
  roots.forEach(el => {
    wasActive.set(el, active(el));
    new MutationObserver(() => check(el)).observe(el, { attributes: true, attributeFilter: ["class", "style", "aria-hidden"] });
  });
  document.addEventListener("app:close", () => {
    roots.forEach(el => {
      el.classList.remove("hwaho-launching");
      wasActive.set(el, false);
    });
  });
})();
}
