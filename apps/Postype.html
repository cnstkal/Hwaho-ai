<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POSTYPE</title>
<link rel="stylesheet" href="../css/postype.css"><script src="../shared/system-bar.js"></script></head><body>
<div id="app">
 <div class="view on" id="v-home">
  <div class="top"><span id="ic-menu"></span><span class="logo">POSTYPE</span><span id="ic-add"></span><span id="ic-gift"></span><span id="ic-bell"></span></div>
  <div class="tabs" id="hometabs"><button class="on" data-tab="discover">발견</button><button data-tab="subs">구독·참여</button></div>
  <div class="scroll" id="feed"></div>
 </div>
 <div class="view" id="v-search">
  <div class="srch"><button data-act="back" id="ic-sback"></button><div class="sbox"><span id="ic-s"></span><input id="q" placeholder="검색어를 입력하세요" enterkeyhint="search"><button id="qx" data-act="clear" style="display:none"></button></div></div>
  <div class="tabs" id="stabs"><button class="on" data-st="all">전체</button><button data-st="post">포스트</button><button data-st="request">리퀘스트</button><button data-st="series">시리즈</button><button data-st="channel">채널</button></div>
  <div class="scroll" id="sres"></div>
 </div>
 <div class="view" id="v-detail">
  <div class="top" style="border-bottom:1px solid var(--ln)"><button data-act="back" id="ic-dback"></button><div style="flex:1;min-width:0"><div id="dtt" style="font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0"></div></div><span id="ic-set"></span><button data-act="share" id="ic-share"></button><button data-act="dmore" id="ic-dm"></button></div>
  <div class="scroll" id="dbody" style="padding:0 16px"></div>
  <div class="pill" id="pill"></div>
 </div>
 <nav class="nav" id="nav"></nav>
</div>
<div class="dim" id="dim"></div>
<div class="sheet" id="sheet"></div>
<script src="../js/postype.js"></script></body></html>
