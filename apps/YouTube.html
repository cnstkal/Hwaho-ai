<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>YouTube</title>
<link rel="stylesheet" href="../css/youtube.css"><script src="../shared/system-bar.js"></script></head>
<body>
<div id="app">
  <!-- 홈 -->
  <section id="home">
    <div class="hd">
      <div class="logo">
        <svg width="32" height="22" viewBox="0 0 32 22"><rect width="32" height="22" rx="6" fill="#f00"/><path d="M13 6.5v9l8-4.5z" fill="#fff"/></svg>
        <span>Premium</span>
      </div>
      <div class="r">
        <button class="bell" id="bell" aria-label="알림">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0112 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg>
          <span class="badge" id="bdg">7</span>
        </button>
        <button id="srch" aria-label="검색"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div id="feed"></div>
    <nav id="nav"></nav>
  </section>

  <!-- 재생 -->
  <section id="watch">
    <div class="pbar"></div>
    <div id="player">
      <div id="pv"></div>
      <div class="promo" id="promo">유료 프로모션 포함</div>
      <div id="cap"></div>
      <div class="minibar"><i id="mini"></i></div>
      <div class="ctl" id="ctl">
        <button class="back" id="wback" aria-label="닫기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="tl">
          <button id="mute" aria-label="음소거"></button>
          <button id="ccb" aria-label="자막"></button>
        </div>
        <button class="pp" id="pp" aria-label="재생/일시정지"></button>
        <div class="bt">
          <div class="seek" id="seek"><div class="tr"></div><div class="fl" id="fl"></div><div class="kn" id="kn"></div></div>
          <span id="tm">0:00 / 0:00</span>
        </div>
      </div>
    </div>
    <div id="wbody"></div>

    <div id="sheet">
      <div class="grab"></div>
      <div class="pane on" id="p-c">
        <div class="sh"><h2>댓글</h2>
          <button id="info" aria-label="정보"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.5" stroke-linecap="round" stroke-width="2.2"/></svg></button>
          <button id="cx" aria-label="닫기"><svg width="26" height="26" viewBox="0 0 24 24" stroke="#0f0f0f" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
        </div>
        <div class="sorts" id="sorts"></div>
        <div id="clist"></div>
        <form class="cin" id="cform"><input class="box" id="cinp" placeholder="댓글 올리기…" autocomplete="off"><button class="sd" id="csd" disabled>등록</button></form>
      </div>
      <div class="pane" id="p-r">
        <div class="sh"><button class="bk" id="rb" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2 style="margin-left:14px">답글</h2>
          <button id="rx" aria-label="닫기"><svg width="26" height="26" viewBox="0 0 24 24" stroke="#0f0f0f" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
        </div>
        <div id="rlist" style="border-top:1px solid #e5e5e5"></div>
        <form class="cin" id="rform"><input class="box" id="rinp" placeholder="답글…" autocomplete="off"><button type="button" class="cam" id="rcam" aria-label="카메라"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="1.9" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button><button class="sd" id="rsd" disabled>등록</button></form>
      </div>
    </div>
    <div class="menu" id="menu"><div class="mb" id="mb"></div></div>
  </section>
</div>
<div id="toast"></div>

<script src="../js/youtube.js"></script>
</body></html>
