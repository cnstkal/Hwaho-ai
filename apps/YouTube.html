<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>YouTube</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;margin:0;height:100%;background:#fff;color:#0f0f0f;font-family:-apple-system,"Apple SD Gothic Neo",Pretendard,"Noto Sans KR",sans-serif;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;font-size:16px;color:#0f0f0f}
svg{display:block}
#app{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.gray{color:#606060}
/* ---------- 홈 ---------- */
#home{position:absolute;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 14px 0 12px;flex:none}
.logo{display:flex;align-items:center;gap:2px;font-weight:700;font-size:22px;letter-spacing:-1.2px}
.hd .r{display:flex;gap:18px;align-items:center}
.bell{position:relative}.badge{position:absolute;top:-6px;right:-7px;min-width:17px;height:17px;border-radius:9px;background:#e8231c;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px;border:1.5px solid #fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 10px;scrollbar-width:none;flex:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:8px;background:#f2f2f2;font-size:14px;font-weight:500;display:flex;align-items:center}
.chip.on{background:#0f0f0f;color:#fff}
#feed{flex:1;min-height:0;overflow-y:auto;padding-bottom:104px}
.vid{margin-bottom:18px}
.th{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;cursor:pointer}
.th .tt{position:absolute;left:0;right:0;bottom:0;padding:0 14px 14px;font-weight:900;font-size:34px;line-height:1.05;letter-spacing:-1.5px;color:#d8ffa8;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.8);color:#fff;font-size:12px;font-weight:600;padding:2px 6px;border-radius:5px}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.35)}.prog i{display:block;height:100%;background:#f00}
.meta{display:flex;gap:12px;padding:12px 12px 0;cursor:pointer}
.av{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;overflow:hidden}
.meta .tx{flex:1;min-width:0}.meta b{display:block;font-weight:500;font-size:15.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta small{display:block;color:#606060;font-size:12.5px;margin-top:3px}
.more{flex:none;width:28px;height:28px;display:flex;align-items:center;justify-content:center;margin-right:-6px}
.shop{margin:10px 12px 0;background:#f8eee9;border-radius:10px;height:38px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:13.5px;font-weight:500}
nav{position:absolute;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));height:60px;border-radius:30px;background:rgba(220,220,224,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:space-around;padding:0 6px;box-shadow:0 2px 10px rgba(0,0,0,.12);z-index:5}
nav button{width:62px;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;position:relative}
nav button.on{background:rgba(120,120,128,.28)}
nav button.mk{width:52px;height:52px;border-radius:50%;background:rgba(120,120,128,.22)}
.rd{position:absolute;top:6px;right:14px;width:10px;height:10px;border-radius:50%;background:#e8231c;border:1.5px solid #dcdce0}
/* ---------- 재생 화면 ---------- */
#watch{position:absolute;inset:0;background:#fff;display:none;flex-direction:column;z-index:20}
#watch.on{display:flex}
.pbar{background:#000;height:env(safe-area-inset-top);flex:none}
#player{position:relative;width:100%;aspect-ratio:16/9;flex:none;overflow:hidden;background:#000;user-select:none}
#pv{position:absolute;inset:0;transition:filter .2s}
#pv .tt{position:absolute;left:0;right:0;bottom:22%;padding:0 18px;font-weight:900;font-size:40px;letter-spacing:-1.5px;color:#d8ffa8;text-shadow:0 2px 8px rgba(0,0,0,.4)}
#cap{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;font-size:14px;padding:3px 10px;border-radius:4px;white-space:nowrap;display:none;max-width:92%;overflow:hidden;text-overflow:ellipsis}
#cap.on{display:block}
.ctl{position:absolute;inset:0;background:rgba(0,0,0,.38);opacity:0;transition:opacity .2s;display:flex;align-items:center;justify-content:center}
.ctl.on{opacity:1}
.ctl .pp{width:54px;height:54px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.ctl .tl{position:absolute;top:8px;right:8px;display:flex;gap:8px}
.ctl .tl button,.ctl .back{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.ctl .back{position:absolute;top:8px;left:8px}
.ctl .bt{position:absolute;left:10px;right:10px;bottom:6px;color:#fff;font-size:12px}
.seek{position:relative;height:18px;display:flex;align-items:center}
.seek .tr{position:absolute;left:0;right:0;height:3px;background:rgba(255,255,255,.4);border-radius:2px}
.seek .fl{position:absolute;left:0;height:3px;background:#f00;border-radius:2px}
.seek .kn{position:absolute;width:12px;height:12px;border-radius:50%;background:#f00;margin-left:-6px}
.minibar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.3)}.minibar i{display:block;height:100%;background:#f00}
.promo{position:absolute;top:12px;left:54px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:500;padding:5px 12px;border-radius:14px;pointer-events:none}
#wbody{flex:1;min-height:0;overflow-y:auto;background:#fff;border-radius:14px 14px 0 0;margin-top:-4px;position:relative}
.vt{padding:14px 14px 0;font-size:18px;font-weight:600;line-height:1.3}
.vs{padding:6px 14px 0;font-size:13.5px;color:#606060;display:flex;flex-wrap:wrap;gap:0 8px}.vs b{color:#0f0f0f;font-weight:600}
.vs .mr{color:#0f0f0f;font-weight:600}
.desc{padding:8px 14px 0;font-size:14px;line-height:1.45;white-space:pre-wrap}
.ar{display:flex;align-items:center;gap:10px;padding:14px;overflow-x:auto;scrollbar-width:none}.ar::-webkit-scrollbar{display:none}
.sub{height:36px;padding:0 16px;border-radius:18px;background:#0f0f0f;color:#fff;font-size:14px;font-weight:600;flex:none}
.sub.on{background:#f2f2f2;color:#0f0f0f}
.sp{flex:1;min-width:6px}
.ab{height:36px;min-width:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;padding:0 4px;flex:none}
.ab.on svg path,.ab.on svg{fill:#0f0f0f}
.cc{margin:0 12px;background:#f2f2f2;border-radius:12px;padding:12px;cursor:pointer;width:calc(100% - 24px);text-align:left;display:block}
.cc .h{font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between}.cc .h span{color:#606060;font-weight:400;margin-left:6px}
.cc .p{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13.5px}.cc .p span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px}.dots i{width:6px;height:6px;border-radius:3px;background:#ccc}.dots i:first-child{width:18px;background:#0f0f0f}
.rel{height:12px}
/* ---------- 댓글 시트 ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 56.25vw);background:#fff;border-radius:14px 14px 0 0;display:none;flex-direction:column;z-index:30;box-shadow:0 -2px 12px rgba(0,0,0,.12)}
#sheet.on{display:flex;animation:su .25s ease-out}
@keyframes su{from{transform:translateY(100%)}to{transform:none}}
.grab{width:40px;height:4px;border-radius:2px;background:#ccc;margin:8px auto 0;flex:none}
.sh{display:flex;align-items:center;height:52px;padding:0 14px;flex:none;gap:10px}
.sh h2{margin:0;font-size:19px;font-weight:700;flex:1}
.sh .bk{width:32px;height:32px;display:flex;align-items:center;justify-content:center;margin-left:-6px}
.sorts{display:flex;gap:8px;padding:2px 14px 12px;flex:none;border-bottom:1px solid #e5e5e5}
.sorts button{height:32px;padding:0 14px;border-radius:8px;background:#f2f2f2;font-size:14px;font-weight:600}.sorts button.on{background:#0f0f0f;color:#fff}
#clist,#rlist{flex:1;min-height:0;overflow-y:auto;padding:0 0 12px}
.cm{display:flex;gap:12px;padding:14px 14px 4px;position:relative}
.cm .bd{flex:1;min-width:0}
.cm .hh{font-size:12.5px;color:#606060;display:flex;align-items:center}.cm .hh b{font-weight:500;color:#0f0f0f}
.cm .hh .m{margin-left:auto;margin-right:-6px;width:28px;height:22px;display:flex;align-items:center;justify-content:center}
.cm p{margin:2px 0 0;font-size:15px;line-height:1.45;word-break:break-word;white-space:pre-wrap}
.cm .ac{display:flex;align-items:center;gap:6px;margin:6px 0 4px;font-size:13px;color:#606060}
.cm .ac button{display:flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 0}
.cm .ac .rp{margin-left:22px}
.cm .ac .on svg path{fill:#0f0f0f}
.rl{display:block;font-weight:600;font-size:14px;padding:6px 0 10px 0;color:#0f0f0f}
.thread::before{content:"";position:absolute;left:32px;top:50px;bottom:14px;width:1.5px;background:#e0e0e0}
.rwrap{position:relative}
.rwrap.has::before{content:"";position:absolute;left:32px;top:56px;bottom:46px;width:1.5px;background:#e0e0e0}
.rsub .cm{padding-left:56px;position:relative}
.rsub .cm::before{content:"";position:absolute;left:32px;top:0;width:20px;height:34px;border-left:1.5px solid #e0e0e0;border-bottom:1.5px solid #e0e0e0;border-bottom-left-radius:14px}
.orig{background:#f2f2f2;padding-bottom:8px}
.cin{flex:none;border-top:1px solid #e5e5e5;padding:10px 14px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;background:#fff}
.cin .box{flex:1;min-width:0;height:42px;border-radius:21px;background:#f2f2f2;border:0;outline:0;padding:0 16px}
.cin .sd{flex:none;height:36px;padding:0 14px;border-radius:18px;background:#065fd4;color:#fff;font-weight:600;font-size:14px}.cin .sd:disabled{background:#e5e5e5;color:#909090}
.cam{width:42px;height:42px;border-radius:50%;background:#f2f2f2;display:flex;align-items:center;justify-content:center;flex:none}
/* 시트 두 개의 화면 전환 */
.pane{display:none;flex-direction:column;flex:1;min-height:0}.pane.on{display:flex}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;white-space:nowrap}
#toast.on{opacity:1}
.menu{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.4);display:none;align-items:flex-end}
.menu.on{display:flex}
.menu .mb{width:100%;background:#fff;border-radius:14px 14px 0 0;padding:8px 0 calc(16px + env(safe-area-inset-bottom))}
.menu .mb button{display:block;width:100%;text-align:left;padding:14px 18px;font-size:16px}
</style></head>
<body>
<div id="app">
  <!-- 홈 -->
  <section id="home">
    <div class="hd">
      <div class="logo">
        <svg width="32" height="22" viewBox="0 0 32 22"><rect width="32" height="22" rx="6" fill="#f00"/><path d="M13 6.5v9l8-4.5z" fill="#fff"/></svg>
        <span>Premium</span>
      </div>
      <div class="r">
        <button class="bell" id="bell" aria-label="알림">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V11a6 6 0 0112 0v6l1.5 2h-15z"/><path d="M10 21h4"/></svg>
          <span class="badge" id="bdg">7</span>
        </button>
        <button id="srch" aria-label="검색"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></button>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div id="feed"></div>
    <nav id="nav"></nav>
  </section>

  <!-- 재생 -->
  <section id="watch">
    <div class="pbar"></div>
    <div id="player">
      <div id="pv"></div>
      <div class="promo" id="promo">유료 프로모션 포함</div>
      <div id="cap"></div>
      <div class="minibar"><i id="mini"></i></div>
      <div class="ctl" id="ctl">
        <button class="back" id="wback" aria-label="닫기"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
        <div class="tl">
          <button id="mute" aria-label="음소거"></button>
          <button id="ccb" aria-label="자막"></button>
        </div>
        <button class="pp" id="pp" aria-label="재생/일시정지"></button>
        <div class="bt">
          <div class="seek" id="seek"><div class="tr"></div><div class="fl" id="fl"></div><div class="kn" id="kn"></div></div>
          <span id="tm">0:00 / 0:00</span>
        </div>
      </div>
    </div>
    <div id="wbody"></div>

    <div id="sheet">
      <div class="grab"></div>
      <div class="pane on" id="p-c">
        <div class="sh"><h2>댓글</h2>
          <button id="info" aria-label="정보"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.5" stroke-linecap="round" stroke-width="2.2"/></svg></button>
          <button id="cx" aria-label="닫기"><svg width="26" height="26" viewBox="0 0 24 24" stroke="#0f0f0f" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
        </div>
        <div class="sorts" id="sorts"></div>
        <div id="clist"></div>
        <form class="cin" id="cform"><input class="box" id="cinp" placeholder="댓글 올리기…" autocomplete="off"><button class="sd" id="csd" disabled>등록</button></form>
      </div>
      <div class="pane" id="p-r">
        <div class="sh"><button class="bk" id="rb" aria-label="뒤로"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2 style="margin-left:14px">답글</h2>
          <button id="rx" aria-label="닫기"><svg width="26" height="26" viewBox="0 0 24 24" stroke="#0f0f0f" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
        </div>
        <div id="rlist" style="border-top:1px solid #e5e5e5"></div>
        <form class="cin" id="rform"><input class="box" id="rinp" placeholder="답글…" autocomplete="off"><button type="button" class="cam" id="rcam" aria-label="카메라"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="1.9" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button><button class="sd" id="rsd" disabled>등록</button></form>
      </div>
    </div>
    <div class="menu" id="menu"><div class="mb" id="mb"></div></div>
  </section>
</div>
<div id="toast"></div>

<script>
/* ============ 아이콘 ============ */
const I={
 home:(f)=>`<svg width="26" height="26" viewBox="0 0 24 24" fill="${f?'#0f0f0f':'none'}" stroke="#0f0f0f" stroke-width="1.8" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>`,
 shorts:`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="1.8" stroke-linejoin="round"><path d="M10 3.5c1.5-1 3.5-.5 4.5 1l.7 1.2 1.3.7c1.7.9 2.2 3 1.2 4.6-.4.6-1 1.1-1.7 1.3l.8 1.3c.9 1.6.4 3.6-1.2 4.5l-4.5 2.6c-1.5 1-3.5.5-4.5-1-.9-1.6-.4-3.6 1.2-4.5l.4-.2c-1.7-.9-2.3-3-1.3-4.6.4-.7 1-1.1 1.7-1.3l-.8-1.3c-1-1.6-.4-3.6 1.3-4.4z"/><path d="M10 9.5v5l4-2.5z" fill="#0f0f0f"/></svg>`,
 plus:`<svg width="30" height="30" viewBox="0 0 24 24" stroke="#0f0f0f" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
 subs:`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M7 4h10M5 7.5h14"/><rect x="3.5" y="10" width="17" height="10" rx="2"/><path d="M10.5 12.5v5l4-2.5z" fill="#0f0f0f"/></svg>`,
 more:`<svg width="22" height="22" viewBox="0 0 24 24" fill="#0f0f0f"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>`,
 up:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="1.7" stroke-linejoin="round"><path d="M7 10v10H4V10zM7 10l4-7c1.5 0 2.5 1 2.5 2.5L13 9h6c1.3 0 2.2 1.2 1.9 2.4l-1.7 7.5c-.2.7-.9 1.1-1.6 1.1H7"/></svg>`,
 dn:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="1.7" stroke-linejoin="round" style="transform:scaleX(-1) scaleY(-1)"><path d="M7 10v10H4V10zM7 10l4-7c1.5 0 2.5 1 2.5 2.5L13 9h6c1.3 0 2.2 1.2 1.9 2.4l-1.7 7.5c-.2.7-.9 1.1-1.6 1.1H7"/></svg>`,
 share:`<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="1.7" stroke-linejoin="round"><path d="M14 4l7 7-7 7v-4c-5 0-8 1.5-10 5 .5-6 3.5-10 10-10z"/></svg>`,
 spark:`<svg width="24" height="24" viewBox="0 0 24 24" fill="#0f0f0f"><path d="M12 2c.8 5 3 7.2 8 8-5 .8-7.2 3-8 8-.8-5-3-7.2-8-8 5-.8 7.2-3 8-8z"/></svg>`,
 reply:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f0f0f" stroke-width="1.8" stroke-linejoin="round"><path d="M4 4h16v12H9l-5 4z"/><path d="M8 8.5h8M8 12h5" stroke-linecap="round"/></svg>`,
 play:`<svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>`,
 pause:`<svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4.5" height="14" rx="1"/><rect x="13.5" y="5" width="4.5" height="14" rx="1"/></svg>`,
 vol:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#fff"/><path d="M16.5 8.5a5 5 0 010 7"/></svg>`,
 mut:`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="#fff"/><path d="M17 9l5 6M22 9l-5 6"/></svg>`,

function openWatch(id){

function closeWatch(){

}

function setPlay(p){
  playing=p;clearInterval(timer);

function updPlayer(){
  if(!cur)return;
  const r=t/cur.dur*100;
  $('#fl').style.width=r+'%';$('#kn').style.left=r+'%';$('#mini').style.width=r+'%';
  $('#tm').textContent=dtxt(t)+' / '+dtxt(cur.dur);
  $('#pp').innerHTML=playing?I.pause:(t>=cur.dur?'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 108-8H8"/><path d="M11 1L8 4l3 3"/></svg>':I.play);
  $('#mute').innerHTML=muted?I.mut:I.vol;
  $('#ccb').innerHTML=I.cc(ccOn);
  const cap=$('#cap');cap.textContent=CAPS[Math.floor(t/4)%CAPS.length];
  cap.classList.toggle('on',ccOn&&playing);
  $('#pv').style.filter=playing?'none':'brightness(.85)';
}

function renderRelated(){
  const box=$('#rel');if(!box||!cur)return;
  box.innerHTML=VIDS.filter(x=>x.id!==cur.id&&!hidden.has(x.id)).map(v=>`<div class="vid">${thumb(v)}
   <div class="meta" data-v="${v.id}">${avatar(v.ch,36)}<div class="tx"><b>${esc(v.title)}</b><small>${esc(CH[v.ch].n)} · 조회수 ${fmt(v.views)}회 · ${agoTxt(v.ago)}</small></div><button class="more" data-m="${v.id}" aria-label="더보기">${I.more}</button></div></div>`).join('');
  box.querySelectorAll('.th,.meta').forEach(e=>e.onclick=ev=>{if(ev.target.closest('[data-m]'))return;if(cur){S.prog[cur.id]=Math.min(.999,t/cur.dur)}openWatch(e.dataset.v)});
  box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>openMenu(b.dataset.m));
}

/* ============ 댓글 시트 ============ */
let sort='pop',openC=null;
function sorted(vid,mode){
  const a=(S.cm[vid]||[]).slice();
  const lk=c=>c.lk+(S.cl[c.id]===1?1:0);
  if(mode==='pop')a.sort((x,y)=>lk(y)-lk(x));
  else if(mode==='old')a.sort((x,y)=>y.ago-x.ago);
  else a.sort((x,y)=>x.ago-y.ago);
  return a;
}
function openSheet(){$('#sheet').classList.add('on');showPane('c');renderSheet()}
function closeSheet(quiet){
  $('#sheet').classList.remove('on');openC=null;
  if(!quiet&&cur)renderInfoKeepScroll();
}
function renderInfoKeepScroll(){const y=$('#wbody').scrollTop;renderInfo();$('#wbody').scrollTop=y}
function showPane(p){$('#p-c').classList.toggle('on',p==='c');$('#p-r').classList.toggle('on',p==='r')}
$('#cx').onclick=()=>closeSheet();
$('#rx').onclick=()=>closeSheet();
$('#rb').onclick=()=>{openC=null;showPane('c');renderSheet()};
$('#info').onclick=()=>toast('댓글은 샘플 데이터이며 이 기기에만 저장됩니다');
const SORTS=[['pop','인기순'],['old','시간순'],['new','최신순']];
function actions(c,kind){
  const st=S.cl[c.id]||0,n=c.lk+(st===1?1:0);
  return `<div class="ac"><button data-l="${c.id}" class="${st===1?'on':''}" aria-label="좋아요">${st===1?I.up.replace('fill="none"','fill="#0f0f0f"'):I.up}<span>${n?fmt(n):''}</span></button>
   <button data-d="${c.id}" class="${st===-1?'on':''}" aria-label="싫어요">${st===-1?I.dn.replace('fill="none"','fill="#0f0f0f"'):I.dn}</button>
   <button class="rp" data-r="${c.id}" aria-label="답글">${I.reply}</button></div>`;
}
function cmHtml(c,opt={}){
  const rc=(S.rp[c.id]||[]).length;
  return `<div class="cm${opt.thread?' thread':''}">${userAv(c.col,opt.sm?26:36,c.u)}<div class="bd">
   <div class="hh"><b>${esc(c.u)}</b>&nbsp;·&nbsp;${agoTxt(c.ago)}<button class="m" data-cm="${c.id}" aria-label="더보기">${I.more}</button></div>
   <p>${esc(c.tx)}</p>${actions(c)}
   ${opt.link&&rc?`<button class="rl" data-o="${c.id}">답글 ${rc}개 ${I.chev.replace('<svg','<svg style="display:inline;vertical-align:-3px;margin-left:4px"')}</button>`:''}</div></div>`;
}
function renderSheet(){
  $('#sorts').innerHTML=SORTS.map(([k,l])=>`<button class="${sort===k?'on':''}" data-s="${k}">${l}</button>`).join('');
  $('#sorts').querySelectorAll('button').forEach(b=>b.onclick=()=>{sort=b.dataset.s;renderSheet();$('#clist').scrollTop=0});
  const list=sorted(cur.id,sort);
  $('#clist').innerHTML=list.length?list.map(c=>cmHtml(c,{thread:(S.rp[c.id]||[]).length>0,link:true})).join(''):'<div style="padding:50px;text-align:center;color:#606060">아직 댓글이 없어요. 첫 댓글을 남겨보세요</div>';
  bindActions($('#clist'));
}
function bindActions(root){
  root.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const id=b.dataset.l;S.cl[id]=S.cl[id]===1?0:1;save();refresh()});
  root.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const id=b.dataset.d;S.cl[id]=S.cl[id]===-1?0:-1;save();refresh()});
  root.querySelectorAll('[data-r],[data-o]').forEach(b=>b.onclick=()=>{openReplies(b.dataset.r||b.dataset.o,!!b.dataset.r)});
  root.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>commentMenu(b.dataset.cm));
}
function refresh(){if(openC)renderReplies();else renderSheet()}
function commentMenu(id){
  const mine=findC(id)&&findC(id).mine;
  $('#mb').innerHTML=(mine?`<button data-a="del">삭제</button>`:'')+`<button data-a="rep">신고</button><button data-a="x">닫기</button>`;
  $('#menu').classList.add('on');
  $('#mb').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    $('#menu').classList.remove('on');
    if(b.dataset.a==='del')delComment(id);
    else if(b.dataset.a==='rep')toast('신고 기능은 지원하지 않아요');
  });
}
function findC(id){
  for(const v in S.cm){const c=S.cm[v].find(x=>x.id===id);if(c)return c}
  for(const k in S.rp){const c=S.rp[k].find(x=>x.id===id);if(c)return c}
}
function delComment(id){
  for(const v in S.cm){const i=S.cm[v].findIndex(x=>x.id===id);if(i>-1){S.cm[v].splice(i,1);delete S.rp[id];save();if(openC===id){openC=null;showPane('c')}renderSheet();return}}
  for(const k in S.rp){const i=S.rp[k].findIndex(x=>x.id===id);if(i>-1){S.rp[k].splice(i,1);save();refresh();return}}
}
/* 댓글 작성 */
const ME={u:'@나',col:['#d9a066','#8a5a2b']};
$('#cinp').oninput=e=>{$('#csd').disabled=!e.target.value.trim()};
$('#cform').onsubmit=e=>{
  e.preventDefault();const tx=$('#cinp').value.trim();if(!tx)return;
  (S.cm[cur.id]=S.cm[cur.id]||[]).push({id:cur.id+'m'+(S.n++),u:ME.u,col:ME.col,ago:0,lk:0,tx,mine:1});
  S.rp[S.cm[cur.id].slice(-1)[0].id]=[];
  save();$('#cinp').value='';$('#csd').disabled=true;$('#cinp').blur();
  sort='new';renderSheet();$('#clist').scrollTop=0;
};
/* ============ 답글 ============ */
function openReplies(id,focus){
  openC=id;showPane('r');renderReplies();
  if(focus)setTimeout(()=>$('#rinp').focus(),50);
}
function renderReplies(){
  const c=findC(openC);if(!c){openC=null;showPane('c');return}
  const rs=S.rp[openC]||[];
  $('#rlist').innerHTML=`<div class="rwrap${rs.length?' has':''}"><div class="orig">${cmHtml(c)}</div><div class="rsub">${rs.map(r=>cmHtml(r,{sm:1})).join('')}</div></div>`;
  $('#rlist').querySelector('.orig [data-r]')?.remove();
  bindActions($('#rlist'));
  $('#rinp').value='';$('#rsd').disabled=true;
}
$('#rinp').oninput=e=>{$('#rsd').disabled=!e.target.value.trim()};
$('#rcam').onclick=()=>toast('사진 첨부는 지원하지 않아요');
$('#rform').onsubmit=e=>{
  e.preventDefault();const tx=$('#rinp').value.trim();if(!tx||!openC)return;
  (S.rp[openC]=S.rp[openC]||[]).push({id:openC+'r'+(S.n++),u:ME.u,col:ME.col,ago:0,lk:0,tx,mine:1});
  save();renderReplies();$('#rlist').scrollTop=$('#rlist').scrollHeight;
};

/* ============ 시작 ============ */
renderChips();renderFeed();renderNav();
addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#sheet').classList.contains('on'))closeSheet();else if(cur)closeWatch()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing)setPlay(false)});
</script>
