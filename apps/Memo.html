<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>메모</title><link rel="stylesheet" href="https://cnstkal.github.io/Hwaho2/css/base.css"><link rel="stylesheet" href="https://cnstkal.github.io/Hwaho2/css/notes.css"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#device{position:fixed;inset:0}#screen{width:100%;height:100%;position:relative;overflow:hidden;background:#fff}#wallpaper,#statusbar,#home,#lock-screen,#home-indicator-zone{display:none!important}#nt-app{display:flex!important;position:absolute;inset:0;z-index:5;opacity:1!important;transform:none!important;border-radius:0!important;padding-top:0!important;visibility:visible!important;background:#f2f1f6}#nt-app[aria-hidden="true"]{display:flex!important;visibility:visible!important}#notes-app{padding-top:0!important}#notes-app .nt-pane{padding-top:0!important}</style><script>if(window.top!==window.self)document.documentElement.setAttribute("data-selfpad","");</script><style>#statusbar,.island{display:none!important}</style></head><body><div id="device"><div id="screen"><div id="wallpaper"></div><div id="home"></div><div id="cal-app" aria-hidden="true"></div><div id="cam-app" aria-hidden="true"></div><div id="pho-app" aria-hidden="true"></div><div id="msg-app" aria-hidden="true"></div><div id="tel-app" aria-hidden="true"></div><div id="saf-app" aria-hidden="true"></div><div id="kko-app" aria-hidden="true"></div><div id="ig-app" aria-hidden="true"></div><div id="clk-app" aria-hidden="true"></div><div id="x-app" aria-hidden="true"></div><div id="et-app" aria-hidden="true"></div><div id="gp-app" aria-hidden="true"></div><div id="sp-app" aria-hidden="true"></div><div id="fm-app" aria-hidden="true"></div><div id="nt-app" aria-hidden="true"></div><div id="yt-app" aria-hidden="true"></div><div id="nf-app" aria-hidden="true"></div><div id="dg-app" aria-hidden="true"></div><div id="bm-app" aria-hidden="true"></div><div id="am-app" aria-hidden="true"></div><div id="home-indicator-zone"><div id="home-indicator"></div></div></div></div><script src="https://cnstkal.github.io/Hwaho2/js/notes.js"></script><script>window.addEventListener("load",()=>{document.dispatchEvent(new CustomEvent("app:open",{detail:{id:"notes"}}));setTimeout(()=>{const app=document.getElementById("notes-app");if(app){app.classList.add("on");app.setAttribute("aria-hidden","false");app.style.cssText+=";display:block!important;visibility:visible!important;opacity:1!important;transform:none!important;";app.querySelectorAll(".nt-pane").forEach(p=>p.style.setProperty("padding-top","0","important"));}},80);});</script></body></html>
