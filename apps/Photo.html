<!doctype html><html lang="ko" data-sysbar="pad"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>사진</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#000}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#pa{position:relative;width:100%;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:#fff}
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.view[hidden]{display:none}
.circ{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid #d8d8dc;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.circ svg,.pill svg{display:block}
/* 보관함 */
.lh{flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:6px 16px 8px 16px}
.lh h1{margin:0;font-size:39px;font-weight:800;letter-spacing:-1.2px;line-height:1.08}
.lh p{margin:1px 0 0;font-size:17px;font-weight:700;letter-spacing:-.3px}
.lh .r{display:flex;gap:11px;padding-bottom:4px}
.pill{height:44px;min-width:44px;border-radius:22px;background:#fff;border:1px solid #d8d8dc;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:500;padding:0 16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pill.ic{padding:0;width:46px}
.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:2px;align-content:start;padding-bottom:120px;-webkit-overflow-scrolling:touch}
.cell{position:relative;height:0;padding:0 0 100%;align-self:start;min-width:0;overflow:hidden;background:#e9e9ed;display:block;width:100%}
.cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:6px;bottom:4px;color:#fff;font-size:15px;font-weight:600;text-shadow:0 0 4px rgba(0,0,0,.45)}
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:0 16px 22px 18px;pointer-events:none}
.nav>*{pointer-events:auto}
.cap{display:flex;height:62px;border-radius:31px;padding:4px;background:rgba(255,255,255,.78);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(0,0,0,.1);width:min(64%,300px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:27px;font-size:12px;font-weight:600;color:#000}
.tab.on{background:rgba(120,120,128,.14);color:#0a7aff}
.sbtn{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.78);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border:1px solid rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center}
/* 상세 */
.dh{flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 16px 12px;border-bottom:1px solid #ececef}
.dt{height:54px;min-width:170px;padding:0 28px;border-radius:27px;background:#fff;border:1px solid #d8d8dc;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.dt b{font-size:17px;font-weight:700;line-height:1.15}
.dt span{font-size:14px;font-weight:600;line-height:1.15}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#fff;position:relative}
.stage img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.strip{flex:none;height:76px;border-top:1px solid #ececef;background:#fff;display:flex;align-items:center;overflow-x:auto;gap:3px;padding:0 12px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:30px;height:44px;border-radius:3px;overflow:hidden;transition:width .15s,opacity .15s;opacity:.95}
.strip button.cur{width:46px;opacity:1}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.act{flex:none;display:flex;justify-content:space-between;align-items:center;padding:14px 20px 30px 20px;border-top:1px solid #ececef;background:#fff}
.act{gap:12px}.act .mid{flex:1;max-width:240px;height:64px;border-radius:32px;background:#fff;border:1px solid #d8d8dc;display:flex;align-items:center;justify-content:space-around;padding:0 8px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.act .circ{width:64px;height:64px}
@media (max-width:360px){.lh h1{font-size:34px}}
</style>
<script>if(window.top!==window.self)document.documentElement.setAttribute("data-selfpad","");</script>
<script src="../shared/system-bar.js"></script></head>
<body>
<div id="pa">
 <section class="view" id="lib">
  <div class="lh">
   <div><h1>보관함</h1><p>19,103개의 항목</p></div>
   <div class="r">
    <button class="pill ic" aria-label="필터 및 보기 옵션"><svg width="26" height="22" viewBox="0 0 26 22" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round"><path d="M3 4h20M6.5 11h13M10 18h6"/></svg></button>
    <button class="pill">선택</button>
   </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="nav">
   <div class="cap">
    <button class="tab on" aria-current="page"><svg width="30" height="26" viewBox="0 0 30 26" fill="#0a7aff"><path d="M8 2.5h15.5A4.5 4.5 0 0 1 28 7v9a4.5 4.5 0 0 1-4.5 4.5H8A4.5 4.5 0 0 1 3.5 16V7A4.5 4.5 0 0 1 8 2.5z" opacity=".35"/><path fill-rule="evenodd" d="M5 6h17a3.5 3.5 0 0 1 3.5 3.5v11A3.5 3.5 0 0 1 22 24H5a3.5 3.5 0 0 1-3.5-3.5v-11A3.5 3.5 0 0 1 5 6zm0 14.5 4.6-5 3.2 3.1 4.2-5.1 5 6.2V20.5H5zM9 10.2a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6z"/></svg>보관함</button>
    <button class="tab"><svg width="30" height="26" viewBox="0 0 30 26" fill="#000"><rect x="5" y="1" width="20" height="3" rx="1.5" opacity=".6"/><rect x="3" y="6" width="24" height="3" rx="1.5" opacity=".8"/><rect x="1.5" y="11" width="27" height="14" rx="4"/></svg>모음</button>
   </div>
   <button class="sbtn" aria-label="검색"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#000" stroke-width="2.8" stroke-linecap="round"><circle cx="13" cy="13" r="8"/><path d="M19 19l7 7"/></svg></button>
  </div>
 </section>
 <section class="view" id="det" hidden>
  <div class="dh">
   <button class="circ" id="back" aria-label="뒤로"><svg width="14" height="24" viewBox="0 0 14 24" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L3 12l9 10"/></svg></button>
   <div class="dt"><b>오늘</b><span id="dtime">오후 12:43</span></div>
   <button class="circ" aria-label="더 보기"><svg width="26" height="6" viewBox="0 0 26 6" fill="#000"><circle cx="3" cy="3" r="3"/><circle cx="13" cy="3" r="3"/><circle cx="23" cy="3" r="3"/></svg></button>
  </div>
  <div class="stage"><img id="big" alt=""></div>
  <div class="strip" id="strip"></div>
  <div class="act">
   <button class="circ" aria-label="공유"><svg width="28" height="34" viewBox="0 0 28 34" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12H5a3 3 0 0 0-3 3v14a3 3 0 0 0 3 3h18a3 3 0 0 0 3-3V15a3 3 0 0 0-3-3h-4M14 2v20M8 8l6-6 6 6"/></svg></button>
   <div class="mid">
    <button aria-label="좋아요"><svg width="36" height="32" viewBox="0 0 36 32" fill="none" stroke="#000" stroke-width="2.6" stroke-linejoin="round"><path d="M18 29S3 20 3 10.5A7.5 7.5 0 0 1 18 7a7.5 7.5 0 0 1 15 3.5C33 20 18 29 18 29z"/></svg></button>
    <button aria-label="정보"><svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round"><circle cx="17" cy="17" r="14.5"/><path d="M17 15v9" /><circle cx="17" cy="9.8" r="1.2" fill="#000" stroke="none"/></svg></button>
    <button aria-label="조정"><svg width="36" height="32" viewBox="0 0 36 32" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round"><path d="M3 7h30M3 16h30M3 25h30"/><circle cx="23" cy="7" r="3.6" fill="#fff"/><circle cx="13" cy="16" r="3.6" fill="#fff"/><circle cx="21" cy="25" r="3.6" fill="#fff"/></svg></button>
   </div>
   <button class="circ" aria-label="삭제"><svg width="30" height="34" viewBox="0 0 30 34" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7h26M11 7V3.5h8V7M5 7l1.5 22a3 3 0 0 0 3 2.8h11a3 3 0 0 0 3-2.8L25 7M12 13v13M18 13v13"/></svg></button>
  </div>
 </section>
</div>
<script>
(function(){
  var BASE="https://raw.githubusercontent.com/cnstkal/Hwaho2/main/images/Photos/";
  // Hwaho2/images/Photos 에 실제 존재하는 파일 번호 (30번은 없음)
  var IDS=[24,5,25,8,12,26,13,31,9,3,32,17,2,28,27,11,1,21,15,22,18,29,6,19,23,4,16,20,7,10,14];
  var VIDEO={12:"0:01"};
  var photos=IDS.map(function(n,i){var h=12+(i*7)%12,m=(i*13+43)%60;return{id:n,src:BASE+n+".jpg",video:VIDEO[n]||"",time:"오후 "+(h>12?h-12:h)+":"+(m<10?"0":"")+m};});
  photos[0].time="오후 12:43";
  var grid=document.getElementById("grid"),strip=document.getElementById("strip"),big=document.getElementById("big"),
      lib=document.getElementById("lib"),det=document.getElementById("det"),dtime=document.getElementById("dtime"),cur=0;
  photos.forEach(function(p,i){
    var b=document.createElement("button");b.className="cell";b.setAttribute("aria-label","사진 "+(i+1));
    b.innerHTML='<img loading="lazy" decoding="async" alt="" src="'+p.src+'">'+(p.video?'<span class="dur">'+p.video+'</span>':"");
    b.onclick=function(){open(i)};grid.appendChild(b);
    var t=document.createElement("button");t.setAttribute("aria-label","사진 "+(i+1));
    t.innerHTML='<img decoding="async" alt="" src="'+p.src+'">';t.onclick=function(){show(i,true)};strip.appendChild(t);
  });
  function show(i,smooth){
    cur=i;big.src=photos[i].src;dtime.textContent=photos[i].time;
    var bs=strip.children;
    for(var k=0;k<bs.length;k++)bs[k].classList.toggle("cur",k===i);
    var el=bs[i];strip.scrollTo({left:el.offsetLeft-(strip.clientWidth-el.offsetWidth)/2,behavior:smooth?"smooth":"auto"});
  }
  function open(i){lib.hidden=true;det.hidden=false;show(i,false);requestAnimationFrame(function(){show(i,false)});}
  document.getElementById("back").onclick=function(){det.hidden=true;lib.hidden=false;};
})();
</script></body></html>
