<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hwaho AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",sans-serif;overflow:hidden}
body{display:grid;place-items:center;background:#171821;color:#fff}
#phone{position:relative;width:min(100vw,56.25dvh);height:min(100dvh,177.78vw);margin:auto;background:linear-gradient(145deg,#f4c7d7,#b8c8f1 55%,#788ab8);display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
#phone:before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 15% 20%,#fff9,transparent 35%),radial-gradient(ellipse at 85% 45%,#d8d9ffb0,transparent 40%),linear-gradient(180deg,#27345022,transparent 45%,#27345033);pointer-events:none}
.status{position:relative;z-index:1;height:48px;flex-shrink:0;padding:14px 24px 0;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700}
.status .signals{display:flex;gap:5px;align-items:center}
.status svg{width:16px;height:14px}
header{position:relative;z-index:1;padding:12px 20px 2px;font-size:13px;font-weight:600;opacity:.95}
#time{position:relative;z-index:1;font-size:42px;font-weight:300;letter-spacing:-2px;padding:0 20px 22px}
main{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 8px;padding:4px 18px;align-content:start}
a{color:white;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;font-weight:600;text-shadow:0 1px 5px #26304d88;min-width:0}
.icon{width:min(15vw,58px);height:min(15vw,58px);max-width:58px;max-height:58px;border-radius:14px;display:grid;place-items:center;background:#ffffffdd;box-shadow:0 3px 10px #18233b35;overflow:hidden}
svg{width:100%;height:100%;display:block}
.dock{position:relative;z-index:1;margin:auto 14px 10px;height:78px;flex-shrink:0;border:1px solid #ffffff55;border-radius:24px;background:#ffffff40;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);display:flex;align-items:center;justify-content:space-evenly;padding:8px}
.dock .icon{width:48px;height:48px;border-radius:13px}
.homebar{position:relative;z-index:1;width:108px;height:5px;border-radius:9px;background:#fff;margin:0 auto 7px;flex-shrink:0}
iframe{display:none;position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:5}
#close{display:none;position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:15px;border:0;border-radius:18px;background:#222d;color:white;padding:9px 14px;font:600 12px -apple-system,sans-serif}
@media(min-width:700px){body{padding:16px}#phone{height:min(calc(100dvh - 32px),177.78vw);width:min(calc((100dvh - 32px)*.5625),100vw);border:7px solid #101014;border-radius:42px;box-shadow:0 20px 70px #0008}.status{padding-top:16px}}</style>
</head>
<body><div id="phone"><div class="status"><span id="clock">9:41</span><span class="signals"><svg viewBox="0 0 20 16" fill="none"><path d="M1 5.5C6 .8 14 .8 19 5.5M4 9c3.5-3.2 8.5-3.2 12 0M7.5 12.3c1.5-1.3 3.5-1.3 5 0" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg><svg viewBox="0 0 22 14" fill="none"><rect x="1" y="2" width="17" height="10" rx="2" stroke="white" stroke-width="1.4"/><rect x="3" y="4" width="12" height="6" rx="1" fill="white"/><path d="M20 5v4" stroke="white" stroke-width="1.6"/></svg></span></div><header>10월 22일 목요일</header><div id="time">9:41</div><main>
<a href="Photo.html"><span class="icon"><svg viewBox="0 0 40 40"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff5d8f"/><stop offset=".5" stop-color="#ffd34f"/><stop offset="1" stop-color="#6bc7ff"/></linearGradient></defs><rect x="3" y="3" width="34" height="34" rx="17" fill="url(#g)"/><circle cx="20" cy="20" r="9" fill="white"/><circle cx="20" cy="20" r="6" fill="#ff7c9e"/><circle cx="29" cy="11" r="2" fill="white"/></svg></span>사진</a>
<a href="Instagram.html"><span class="icon"><svg viewBox="0 0 40 40"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffb52e"/><stop offset=".5" stop-color="#e1306c"/><stop offset="1" stop-color="#7438c9"/></linearGradient></defs><rect x="3" y="3" width="34" height="34" rx="10" fill="url(#ig)"/><rect x="10" y="10" width="20" height="20" rx="6" fill="none" stroke="white" stroke-width="2.5"/><circle cx="20" cy="20" r="5" fill="none" stroke="white" stroke-width="2.5"/><circle cx="27" cy="13" r="1.7" fill="white"/></svg></span>인스타</a>
<a href="Dcinside.html"><span class="icon"><svg viewBox="0 0 40 40"><rect x="3" y="3" width="34" height="34" rx="17" fill="#252a34"/><text x="20" y="25" font-size="17" font-weight="900" text-anchor="middle" fill="white">dc</text></svg></span>디시</a>
</main><div class="dock"><span class="icon"><svg viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="#43c866"/><path d="M8 10h24v18H19l-7 5v-5H8z" fill="white"/></svg></span><span class="icon"><svg viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="#e8f1ff"/><circle cx="20" cy="20" r="15" fill="#5ba8ff"/><circle cx="20" cy="20" r="11" fill="white"/><circle cx="20" cy="20" r="8" fill="#5ba8ff"/></svg></span><span class="icon"><svg viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="#f8f8fa"/><path d="M20 5l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#999"/></svg></span><span class="icon"><svg viewBox="0 0 40 40"><rect width="40" height="40" rx="10" fill="#fafafa"/><path d="M20 5l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#30313a"/></svg></span></div><div class="homebar"></div><iframe id="app" title="앱"></iframe><button id="close">⌂ 홈으로</button>
<script>
const frame=document.getElementById('app'),close=document.getElementById('close');
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('time').textContent=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})}tick();document.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();frame.src=a.getAttribute('href');frame.style.display='block';close.style.display='block'}));
close.onclick=()=>{frame.src='about:blank';frame.style.display='none';close.style.display='none'};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close.click()});
</script></body></html>
