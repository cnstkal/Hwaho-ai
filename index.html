<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hwaho AI</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#f4f4f8;color:#111;overflow:hidden}
#phone{width:min(100vw,56.25dvh);height:100dvh;margin:auto;background:#fff;display:flex;flex-direction:column;overflow:hidden}
header{padding:28px 20px 18px;font-size:28px;font-weight:800;letter-spacing:-1px}
main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 10px;padding:12px 16px;align-content:start}
a{color:inherit;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600}
.icon{width:min(18vw,62px);height:min(18vw,62px);border-radius:15px;display:grid;place-items:center;background:#fff;box-shadow:0 3px 12px #00000018}
svg{width:38px;height:38px;display:block}
iframe{display:none;position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;z-index:5}
#close{display:none;position:fixed;z-index:6;right:12px;top:12px;border:0;border-radius:18px;background:#222b;color:white;padding:9px 14px;font:inherit}
</style>
</head>
<body><div id="phone"><header>앱</header><main>
<a href="Photo.html"><span class="icon"><svg viewBox="0 0 40 40"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff5d8f"/><stop offset=".5" stop-color="#ffd34f"/><stop offset="1" stop-color="#6bc7ff"/></linearGradient></defs><rect x="3" y="3" width="34" height="34" rx="17" fill="url(#g)"/><circle cx="20" cy="20" r="9" fill="white"/><circle cx="20" cy="20" r="6" fill="#ff7c9e"/><circle cx="29" cy="11" r="2" fill="white"/></svg></span>사진</a>
<a href="Instagram.html"><span class="icon"><svg viewBox="0 0 40 40"><defs><linearGradient id="ig" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ffb52e"/><stop offset=".5" stop-color="#e1306c"/><stop offset="1" stop-color="#7438c9"/></linearGradient></defs><rect x="3" y="3" width="34" height="34" rx="10" fill="url(#ig)"/><rect x="10" y="10" width="20" height="20" rx="6" fill="none" stroke="white" stroke-width="2.5"/><circle cx="20" cy="20" r="5" fill="none" stroke="white" stroke-width="2.5"/><circle cx="27" cy="13" r="1.7" fill="white"/></svg></span>인스타</a>
<a href="Dcinside.html"><span class="icon"><svg viewBox="0 0 40 40"><rect x="3" y="3" width="34" height="34" rx="17" fill="#252a34"/><text x="20" y="25" font-size="17" font-weight="900" text-anchor="middle" fill="white">dc</text></svg></span>디시</a>
</main></div><iframe id="app" title="앱"></iframe><button id="close">닫기</button>
<script>
const frame=document.getElementById('app'),close=document.getElementById('close');
document.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();frame.src=a.getAttribute('href');frame.style.display='block';close.style.display='block'}));
close.onclick=()=>{frame.src='about:blank';frame.style.display='none';close.style.display='none'};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close.click()});
</script></body></html>
