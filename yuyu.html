<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yuyu</title>
<style>
:root{--bg:#fff;--bg2:#F5F6F9;--tx:#16171B;--tx2:#6B6F7A;--ln:#E8E9EE;--ac:#6F7DF2;--ac2:#EEF0FF;--ub:#EEF0FF;box-sizing:border-box}
:root[data-theme="dark"]{--bg:#121316;--bg2:#1B1C21;--tx:#F2F3F6;--tx2:#9A9EAA;--ln:#2A2B32;--ac:#8E9BFF;--ac2:#23253A;--ub:#23253A;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Pretendard,"Pretendard Variable",-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg2);color:var(--tx);display:flex;justify-content:center;align-items:center}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.phone{position:relative;width:100%;height:100%;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:600px){body{background:#E4E6EE}:root[data-theme="dark"] body{background:#07080A}.phone{width:390px;height:min(844px,96vh);border-radius:44px;border:1px solid var(--ln);box-shadow:0 20px 60px rgba(30,40,90,.15);padding-top:0}}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{display:flex;align-items:center;gap:8px;height:52px;padding:0 10px;flex:none}
header .t{font-weight:700;font-size:18px;letter-spacing:-.02em;flex:1}
.ib{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;color:var(--tx)}
.ib:active{background:var(--bg2)}
main{flex:1;overflow-y:auto;padding:8px 18px 16px;scroll-behavior:smooth}
.hero{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.hero h1{font-size:24px;font-weight:700;letter-spacing:-.03em;margin-top:22px}
.hero p{color:var(--tx2);font-size:15px}
.orb{animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.sug{display:flex;flex-direction:column;gap:8px;padding:0 16px 10px;flex:none}
.sug button{text-align:left;padding:13px 16px;border-radius:16px;background:var(--bg2);font-size:15px;display:flex;align-items:center;gap:12px}
.sug svg{color:var(--ac)}
.m{margin:14px 0;font-size:16px;line-height:1.65;letter-spacing:-.01em}
.m.u{display:flex;justify-content:flex-end}
.m.u span{background:var(--ub);padding:10px 15px;border-radius:20px 20px 6px 20px;max-width:82%;white-space:pre-wrap;word-break:break-word}
.m.a h4{font-size:17px;font-weight:700;margin:14px 0 4px}
.m.a p{margin:6px 0}
.m.a ul{padding-left:20px;margin:6px 0}.m.a li{margin:3px 0}
.m.a b{font-weight:700}
.acts{display:flex;gap:2px;margin:6px 0 0 -8px;color:var(--tx2)}
.acts button{width:34px;height:34px;border-radius:17px;display:grid;place-items:center}
.acts button:active{background:var(--bg2)}
.acts svg{width:18px;height:18px}.acts .on{color:var(--ac)}
.typing{display:flex;gap:5px;padding:12px 0}.typing i{width:7px;height:7px;border-radius:4px;background:var(--ac);opacity:.3;animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:1;transform:translateY(-3px)}}
.comp{flex:none;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));position:relative}
.box{display:flex;align-items:flex-end;gap:4px;background:var(--bg2);border:1px solid var(--ln);border-radius:26px;padding:5px}
.box textarea{flex:1;border:0;background:none;resize:none;outline:none;font:inherit;font-size:16px;color:var(--tx);line-height:1.45;padding:9px 4px;max-height:120px;height:40px}
.box textarea::placeholder{color:var(--tx2)}
.send{width:40px;height:40px;border-radius:20px;display:grid;place-items:center;background:var(--ln);color:var(--tx2);transition:.15s}
.send.on{background:var(--ac);color:#fff}
.pop{position:absolute;left:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg);border:1px solid var(--ln);border-radius:18px;padding:6px;min-width:190px;display:none;z-index:5;box-shadow:0 8px 28px rgba(0,0,0,.1)}
.pop.on{display:block}
.pop button,.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:12px;font-size:15px;text-align:left}
.pop button:active,.menu button:active{background:var(--bg2)}
.scrim{position:absolute;inset:0;background:rgba(10,12,20,.35);opacity:0;pointer-events:none;transition:.25s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:absolute;top:0;bottom:0;left:0;width:84%;background:var(--bg);z-index:11;transform:translateX(-102%);transition:transform .28s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer.on{transform:none}
.drawer .hd{display:flex;align-items:center;padding:0 10px 0 18px;height:52px}
.drawer .hd b{flex:1;font-size:18px;letter-spacing:-.02em}
.list{flex:1;overflow-y:auto;padding:4px 10px}
.it{display:flex;align-items:center;border-radius:14px;position:relative}
.it.cur{background:var(--ac2)}
.it>button.o{flex:1;text-align:left;padding:11px 8px 11px 12px;min-width:0}
.it .ti{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .pv{font-size:13px;color:var(--tx2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{position:absolute;right:8px;top:44px;background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:5px;z-index:3;width:140px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.empty{text-align:center;color:var(--tx2);padding:60px 20px;font-size:15px;line-height:1.6}
.dfoot{padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln)}
.dfoot button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 6px;font-size:15px}
.av{width:30px;height:30px;border-radius:15px;background:var(--ac2);color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:13px}
.page{position:absolute;inset:0;background:var(--bg2);z-index:12;transform:translateX(102%);transition:transform .28s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.page.on{transform:none}
.page .hd{display:flex;align-items:center;gap:4px;height:52px;padding:0 10px;background:var(--bg2)}
.page .hd b{font-size:17px}
.pb{flex:1;overflow-y:auto;padding:8px 16px 30px}
.gh{font-size:13px;color:var(--tx2);margin:18px 6px 8px}
.grp{background:var(--bg);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:15px;min-height:52px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--ln)}
.row .r{margin-left:auto;color:var(--tx2);font-size:14px}
.seg{display:flex;background:var(--bg2);border-radius:10px;padding:2px;margin-left:auto}
.seg button{padding:5px 12px;border-radius:8px;font-size:13px;color:var(--tx2)}
.seg button.on{background:var(--bg);color:var(--tx);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.sw{margin-left:auto;width:46px;height:28px;border-radius:14px;background:var(--ln);position:relative;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:.2s}
.sw.on{background:var(--ac)}.sw.on::after{left:21px}
.toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="phone" id="ph">
  <header>
    <button class="ib" id="bMenu" aria-label="대화 목록"></button>
    <div class="t">yuyu</div>
    <button class="ib" id="bNew" aria-label="새 대화"></button>
    <button class="ib" id="bSet" aria-label="설정"></button>
  </header>
  <main id="main"></main>
  <div class="sug" id="sug"></div>
  <div class="comp">
    <div class="pop" id="pop"></div>
    <div class="box">
      <button class="ib" id="bPlus" aria-label="추가"></button>
      <textarea id="inp" rows="1" placeholder="yuyu에게 물어봐"></textarea>
      <button class="send" id="bSend" aria-label="전송"></button>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer">
    <div class="hd"><b>대화</b><button class="ib" id="dNew" aria-label="새 대화"></button><button class="ib" id="dClose" aria-label="닫기"></button></div>
    <div class="list" id="list"></div>
    <div class="dfoot"><button id="dSet"><span class="av">유</span>설정</button></div>
  </aside>

  <section class="page" id="settings">
    <div class="hd"><button class="ib" id="sBack" aria-label="뒤로"></button><b>설정</b></div>
    <div class="pb">
      <div class="gh">화면</div>
      <div class="grp"><div class="row">테마<div class="seg" id="seg"><button data-t="light">라이트</button><button data-t="dark">다크</button></div></div></div>
      <div class="gh">대화</div>
      <div class="grp">
        <button class="row" data-sw="short">짧게 답하기<span class="sw" id="sw-short"></span></button>
        <button class="row" data-sw="save">대화 기록 저장<span class="sw on" id="sw-save"></span></button>
        <button class="row" id="clearAll">모든 대화 삭제<span class="r">삭제</span></button>
      </div>
      <div class="gh">정보</div>
      <div class="grp">
        <div class="row">버전<span class="r">1.0.0</span></div>
        <div class="row">이 앱은 실제 AI와 연결되지 않은 시뮬레이션이에요.</div>
      </div>
    </div>
  </section>
  <div class="toast" id="toast"></div>
</div>

<script>
const P={
menu:'<path d="M4 8h12M4 16h16"/>',plus:'<path d="M12 5v14M5 12h14"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16v4zM13 7l4 4"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3.9a7 7 0 0 0-2-1.2L14.2 3h-4l-.4 2.6a7 7 0 0 0-2 1.2l-2.3-.9-2 3.4 2 1.5a7 7 0 0 0 0 2.4l-2 1.5 2 3.4 2.3-.9a7 7 0 0 0 2 1.2l.4 2.6h4l.4-2.6a7 7 0 0 0 2-1.2l2.3.9 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/>',
send:'<path d="M12 19V5M5 12l7-7 7 7"/>',copy:'<rect x="8" y="8" width="12" height="12" rx="3"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',redo:'<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',up:'<path d="M7 11v9H4v-9h3zM7 11l4-8c1.5 0 2.500 1 2.500 2.500V9h5.500a2 2 0 0 1 2 2.300l-1.200 7a2 2 0 0 1-2 1.700H7"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',back:'<path d="M15 5l-7 7 7 7"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',trash:'<path d="M5 7h14M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/>',img:'<rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="10" r="1.500"/><path d="M20 15l-4-4-9 9"/>',cam:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.500"/>',file:'<path d="M7 3h7l5 5v13H7zM14 3v5h5"/>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',chat:'<path d="M5 6a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-6l-4 4v-4H7a2 2 0 0 1-2-2z"/>',q:'<circle cx="12" cy="12" r="9"/><path d="M9.500 9.500a2.500 2.500 0 1 1 3.500 2.300c-.6.300-1 .8-1 1.500M12 17h.01"/>',list:'<path d="M9 6h11M9 12h11M9 18h11M4.500 6h.01M4.500 12h.01M4.500 18h.01"/>',bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.500 10.900c.6.500 1 1.200 1 2.100h5c0-.9.400-1.600 1-2.100A6 6 0 0 0 12 3z"/>'};
const ic=n=>`<svg class="i" viewBox="0 0 24 24">${P[n]}</svg>`;
const orb=(s,id='o')=>`<svg class="orb" width="${s}" height="${s}" viewBox="0 0 100 100"><defs><radialGradient id="${id}a" cx="35%" cy="30%"><stop offset="0" stop-color="#fff"/><stop offset=".45" stop-color="#C9D0FF"/><stop offset="1" stop-color="#6F7DF2"/></radialGradient><radialGradient id="${id}b" cx="70%" cy="75%"><stop offset="0" stop-color="#A8E3FF" stop-opacity=".9"/><stop offset="1" stop-color="#A8E3FF" stop-opacity="0"/></radialGradient><filter id="${id}f"><feGaussianBlur stdDeviation="1.500"/></filter></defs><circle cx="50" cy="50" r="40" fill="url(#${id}a)"/><circle cx="50" cy="50" r="40" fill="url(#${id}b)"/><path d="M14 56c14-14 30 8 44-4s22-8 28 0" stroke="#fff" stroke-opacity=".7" stroke-width="3" fill="none" filter="url(#${id}f)" stroke-linecap="round"/></svg>`;
const $=s=>document.querySelector(s);
let sv=[];try{sv=JSON.parse(localStorage.getItem('yuyu')||'[]')}catch(e){}
const seed=[
{id:1,title:'주말 제주 여행 계획',msgs:[{r:'u',t:'이번 주말에 제주도 가려는데 일정 좀 짜줘'},{r:'a',t:'## 1박 2일 추천 일정\n**첫째 날**은 서쪽, **둘째 날**은 동쪽으로 나누면 이동이 편해요.\n- 오전: 협재 해변 산책과 브런치\n- 오후: 오설록 티뮤지엄, 한림 카페거리\n- 저녁: 흑돼지 구이 후 숙소 휴식\n둘째 날은 성산일출봉과 섭지코지를 묶어서 다녀오면 좋아요.'}]},
{id:2,title:'면접 준비 고민',msgs:[{r:'u',t:'내일 면접인데 너무 떨려'},{r:'a',t:'떨리는 건 그만큼 준비를 열심히 했다는 뜻이에요.\n- 자기소개는 1분 안에 말할 수 있게 한 번만 소리 내어 읽어보기\n- 예상 질문 세 가지만 골라 답 정리하기\n- 오늘은 일찍 자기\n원하면 예상 질문으로 같이 연습해볼까요?'}]},
{id:3,title:'카페 이름 아이디어',msgs:[{r:'u',t:'작은 로스터리 카페 이름 추천해줘'},{r:'a',t:'## 이름 후보\n- **오후의 원두**: 여유로운 분위기\n- **결**: 짧고 단정한 한 글자\n- **하루 한 잔**: 친근하고 기억에 남는 이름\n분위기를 알려주시면 더 좁혀볼게요.'}]}];
let S={convs:sv.length?sv:seed,cur:null,theme:'light',short:false,save:true,like:{}};
const ST=()=>{if(S.save)try{localStorage.setItem('yuyu',JSON.stringify(S.convs))}catch(e){}};
const R=[
{k:['안녕','반가','하이'],a:['안녕하세요! 오늘 하루는 어땠나요? 편하게 이야기해 주세요.','반가워요. 궁금한 게 있거나 그냥 수다를 떨고 싶을 때 불러주세요.']},
{k:['오늘','있었던','하루'],a:['## 오늘 이야기 들려주세요\n어떤 일이 가장 기억에 남나요?\n- 기분 좋았던 순간\n- 조금 힘들었던 순간\n- 그냥 웃겼던 순간\n하나만 골라서 말해주셔도 좋아요.']},
{k:['고민','정리','힘들','걱정'],a:['## 같이 정리해볼게요\n먼저 마음에 걸리는 것을 다 꺼내볼까요?\n- **지금 가장 신경 쓰이는 것**은 무엇인가요?\n- 내가 바꿀 수 있는 부분과 없는 부분을 나눠보면 한결 가벼워져요.\n순서 없이 적어도 괜찮아요.']},
{k:['아이디어','추천','이름','생각'],a:['## 아이디어 세 가지\n- **작게 시작하기**: 일주일 안에 해볼 수 있는 버전을 만들어요.\n- **거꾸로 생각하기**: 불편한 점에서 출발해요.\n- **조합하기**: 관심사 두 가지를 섞어봐요.\n어떤 주제인지 알려주시면 구체적으로 이어갈게요.']},
{k:['날씨','비','더워','추워'],a:['저는 실시간 날씨를 볼 수 없는 시뮬레이션이에요. 대신 외출 전에 기온을 확인하고, 일교차가 크면 얇은 겉옷을 챙기는 걸 추천해요.']},
{k:['고마','감사'],a:['도움이 됐다니 기뻐요. 또 필요하면 언제든 물어보세요.']},
{k:['점심','저녁','밥','메뉴'],a:['## 메뉴 추천\n- 가볍게: 비빔국수, 샐러드 파스타\n- 든든하게: 제육덮밥, 순두부찌개\n- 기분 전환: 떡볶이와 튀김\n오늘 컨디션이 어떤지 알려주면 하나로 골라드릴게요.']}];
const F=['흥미로운 질문이에요. 조금 더 구체적으로 알려주시면 더 잘 도와드릴 수 있어요. 어떤 상황인지 한 줄만 더 말해줄래요?','## 이렇게 생각해볼 수 있어요\n- 먼저 **목표**를 한 문장으로 적어보기\n- 지금 가진 것과 부족한 것을 나누기\n- 가장 작은 첫 단계를 정하기\n어느 부분부터 같이 볼까요?','네, 이해했어요. 핵심만 짚어보면 **우선순위를 정하는 것**이 가장 중요해 보여요. 이어서 자세히 이야기해볼까요?','좋은 포인트예요. 비슷한 상황에서는 **한 번에 하나씩** 해결하는 방식이 잘 맞는 편이에요. 원하는 방향을 알려주세요.'];
let fi=0,busy=false;
function reply(t,regen){const l=t.toLowerCase();let c=R.find(r=>r.k.some(k=>l.includes(k)));let a;if(c){a=c.a[Math.floor(Math.random()*c.a.length)]}else{a=F[fi++%F.length]}if(S.short)a=a.split('\n').filter(x=>!x.startsWith('- ')).join('\n');return a}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(t){let h='',ul=false;const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');t.split('\n').forEach(L=>{if(L.startsWith('- ')){if(!ul){h+='<ul>';ul=true}h+='<li>'+inl(L.slice(2))+'</li>'}else{if(ul){h+='</ul>';ul=false}if(L.startsWith('## '))h+='<h4>'+inl(L.slice(3))+'</h4>';else if(L.trim())h+='<p>'+inl(L)+'</p>'}});return h+(ul?'</ul>':'')}
const conv=()=>S.convs.find(c=>c.id===S.cur);
function render(){const c=conv(),m=$('#main');
 if(!c||!c.msgs.length){m.innerHTML=`<div class="hero">${orb(112,'h')}<h1>무엇이든 편하게 물어보세요</h1><p>유유가 옆에서 같이 생각해 드릴게요</p></div>`;
  $('#sug').classList.remove('hide');$('#sug').innerHTML=[['chat','오늘 있었던 일 이야기하기'],['q','궁금한 것 물어보기'],['list','고민 같이 정리하기'],['bulb','새로운 아이디어 떠올리기']].map(([i,t])=>`<button data-s="${t}">${ic(i)}${t}</button>`).join('')}
 else{$('#sug').classList.add('hide');m.innerHTML=c.msgs.map((x,i)=>x.r==='u'?`<div class="m u"><span>${esc(x.t)}</span></div>`:`<div class="m a">${md(x.t)}<div class="acts"><button data-a="copy" data-i="${i}" aria-label="복사">${ic('copy')}</button><button data-a="redo" data-i="${i}" aria-label="다시 생성">${ic('redo')}</button><button data-a="like" data-i="${i}" class="${S.like[c.id+'-'+i]?'on':''}" aria-label="좋아요">${ic('up')}</button></div></div>`).join('')+(busy?'<div class="m a"><div class="typing"><i></i><i></i><i></i></div></div>':'');m.scrollTop=m.scrollHeight}
}
function title(t){return t.length>16?t.slice(0,16)+'…':t}
function send(t){t=t.trim();if(!t||busy)return;let c=conv();if(!c){c={id:Date.now(),title:title(t),msgs:[]};S.convs.unshift(c);S.cur=c.id}
 c.msgs.push({r:'u',t});$('#inp').value='';grow();busy=true;render();
 setTimeout(()=>{c.msgs.push({r:'a',t:reply(t)});busy=false;ST();render();list()},900)}
function list(){const el=$('#list');if(!S.convs.length){el.innerHTML='<div class="empty">아직 대화가 없어요.<br>새 대화를 시작해 보세요.</div>';return}
 el.innerHTML=S.convs.map(c=>{const l=c.msgs[c.msgs.length-1];return`<div class="it ${c.id===S.cur?'cur':''}"><button class="o" data-o="${c.id}"><div class="ti">${esc(c.title)}</div><div class="pv">${l?esc(l.t.replace(/[#*\-]/g,'').trim().split('\n')[0]):'새 대화'}</div></button><button class="ib" data-m="${c.id}" aria-label="메뉴">${ic('more')}</button></div>`}).join('')}
function drawer(o){$('#drawer').classList.toggle('on',o);$('#scrim').classList.toggle('on',o);if(o)list()}
function newChat(){S.cur=null;busy=false;render();drawer(false);$('#inp').focus()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
function grow(){const i=$('#inp');i.style.height='40px';i.style.height=Math.min(i.scrollHeight,120)+'px';$('#bSend').classList.toggle('on',!!i.value.trim())}
function theme(t){S.theme=t;document.documentElement.dataset.theme=t;document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
// init
$('#bMenu').innerHTML=ic('menu');$('#bNew').innerHTML=ic('edit');$('#bSet').innerHTML=ic('gear');$('#bPlus').innerHTML=ic('plus');$('#bSend').innerHTML=ic('send');$('#dNew').innerHTML=ic('edit');$('#dClose').innerHTML=ic('x');$('#sBack').innerHTML=ic('back');
$('#pop').innerHTML=[['img','사진 보관함'],['cam','카메라'],['file','파일'],['mic','음성으로 말하기']].map(([i,t])=>`<button data-p="${t}">${ic(i)}${t}</button>`).join('');
$('#bMenu').onclick=()=>drawer(true);$('#dClose').onclick=()=>drawer(false);$('#scrim').onclick=()=>{drawer(false);$('#pop').classList.remove('on')};
$('#bNew').onclick=newChat;$('#dNew').onclick=newChat;
const openS=o=>{$('#settings').classList.toggle('on',o);if(o)drawer(false)};
$('#bSet').onclick=()=>openS(true);$('#dSet').onclick=()=>openS(true);$('#sBack').onclick=()=>openS(false);
$('#bSend').onclick=()=>send($('#inp').value);
$('#inp').oninput=grow;$('#inp').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send($('#inp').value)}};
$('#bPlus').onclick=()=>$('#pop').classList.toggle('on');
$('#pop').onclick=e=>{const b=e.target.closest('button');if(b){$('#pop').classList.remove('on');toast(b.dataset.p+'은(는) 시뮬레이션에서 사용할 수 없어요')}};
$('#sug').onclick=e=>{const b=e.target.closest('button');if(b)send(b.dataset.s)};
$('#main').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const c=conv(),i=+b.dataset.i,a=b.dataset.a;
 if(a==='copy'){try{navigator.clipboard.writeText(c.msgs[i].t)}catch(x){}toast('복사했어요')}
 if(a==='like'){const k=c.id+'-'+i;S.like[k]=!S.like[k];b.classList.toggle('on',S.like[k])}
 if(a==='redo'&&!busy){const q=c.msgs[i-1].t;c.msgs.splice(i);busy=true;render();setTimeout(()=>{c.msgs.push({r:'a',t:reply(q)});busy=false;ST();render()},900)}};
$('#list').onclick=e=>{const o=e.target.closest('[data-o]'),m=e.target.closest('[data-m]'),d=e.target.closest('[data-d]');
 document.querySelectorAll('.menu').forEach(x=>x.remove());
 if(o){S.cur=+o.dataset.o;busy=false;render();drawer(false)}
 if(m){const p=m.parentElement;p.insertAdjacentHTML('beforeend',`<div class="menu"><button data-n>${ic('edit')}새 대화</button><button data-d="${m.dataset.m}">${ic('trash')}삭제</button></div>`)}
 if(e.target.closest('[data-n]'))newChat();
 if(d){const id=+d.dataset.d;S.convs=S.convs.filter(c=>c.id!==id);if(S.cur===id)S.cur=null;ST();render();list();toast('대화를 삭제했어요')}};
document.addEventListener('click',e=>{if(!e.target.closest('#bPlus,#pop'))$('#pop').classList.remove('on')});
$('#seg').onclick=e=>{const b=e.target.closest('button');if(b)theme(b.dataset.t)};
document.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{const k=b.dataset.sw;S[k]=!S[k];$('#sw-'+k).classList.toggle('on',S[k])});
$('#clearAll').onclick=()=>{S.convs=[];S.cur=null;ST();render();toast('모든 대화를 삭제했어요')};
theme(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
render();grow();
</script>
</body>
</html>
