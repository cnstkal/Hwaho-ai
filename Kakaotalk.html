function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)})}

fsave:async()=>{const o=await collect(),bad=V.form.onSave(o);if(bad)return;V.sheet=null;save();render()},
fdel:()=>{if(confirm('삭제할까요?')){V.form.onDel();V.sheet=null;save();render()}},
clr:d=>{V.form.fields[+d.i].v=null;const el=document.querySelector(`[data-f="${d.i}"]`);el.value='';V.form.fields[+d.i].v=null;d.el.previousElementSibling&&0;d.el.remove()}
};
A.set2=()=>form('채팅 테마',[{k:'bg',l:'채팅방 배경',t:'color',v:S.theme.bg},{k:'me',l:'내 말풍선',t:'color',v:S.theme.me}],o=>{S.theme=o;document.documentElement.style.setProperty('--me',o.me)});
function autoRead(r){setTimeout(()=>{r.msgs.forEach(m=>{if(m.me&&m.unread)m.unread=0});save();if(V.room==r.id)render()},1500)}
document.addEventListener('click',e=>{if(e.target.closest('[data-stop]')&&!e.target.closest('[data-a]'))return;const el=e.target.closest('[data-a]');if(!el||!A[el.dataset.a])return;e.stopPropagation();const keep=V.st;V.st=undefined;A[el.dataset.a]({...el.dataset,el})});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='fq'){V.fq=t.value;render();const c=$('#fq');c.focus();c.setSelectionRange(99,99)}
if(t.id=='cq'){V.q=t.value;render();const c=$('#cq');c.focus();c.setSelectionRange(99,99)}
if(t.id=='rq'){V.rq=t.value;render();const c=$('#rq');c.focus();c.setSelectionRange(99,99)}
if(t.id=='ti'){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,100)+'px'}});
document.addEventListener('keydown',e=>{if(e.target.id=='ti'&&e.key=='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();A.send()}});
document.documentElement.style.setProperty('--me',S.theme.me);
render();
</script></body></html>
