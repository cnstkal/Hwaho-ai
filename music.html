<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>음악</title>
<style>
:root{--bg:#fff;--fg:#000;--sub:#8e8e93;--red:#fa2d48;--sep:#e5e5ea;--fill:#f2f2f7;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#000;--fg:#fff;--sep:#2c2c2e;--fill:#1c1c1e}}
:root[data-theme=dark]{--bg:#000;--fg:#fff;--sep:#2c2c2e;--fill:#1c1c1e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px -apple-system,'SF Pro Text','Apple SD Gothic Neo','Noto Sans KR',sans-serif}
#app{position:fixed;inset:0;max-width:480px;margin:auto;overflow:hidden;background:var(--bg)}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:env(safe-area-inset-top,0px) 0 calc(130px + env(safe-area-inset-bottom,0px))}
h1{font-size:34px;font-weight:800;margin:14px 16px 6px;letter-spacing:-.5px;display:flex;justify-content:space-between;align-items:center}
h2.sec{font-size:22px;font-weight:700;margin:22px 16px 10px;letter-spacing:-.3px}
.hs{display:flex;gap:12px;overflow-x:auto;padding:0 16px;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.card{flex:0 0 150px;min-width:0}.card b{display:block;font-weight:500;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.card span{display:block;color:var(--sub);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ban{flex:0 0 280px}.ban small{color:var(--sub);font-size:11px;font-weight:600;text-transform:uppercase;display:block;margin-bottom:4px}
.card.r .cv{border-radius:50%}.card.r{text-align:center}
.cv{display:block;width:100%;aspect-ratio:1;border-radius:8px;background:var(--fill);object-fit:cover}.cv.r{border-radius:50%}
.tr{display:flex;align-items:center;gap:12px;padding:6px 16px}.tr .cv{width:48px;flex:none;border-radius:5px}.tr .n{width:24px;text-align:center;color:var(--sub);font-style:normal;flex:none}
.ti{flex:1;min-width:0;border-bottom:.5px solid var(--sep);padding:8px 0}.ti b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ti span{color:var(--sub);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr u{text-decoration:none;color:var(--sub);font-size:13px}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;padding-bottom:env(safe-area-inset-bottom,0px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--sep);z-index:5}
.tabbar div{flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sub);font-size:10px}.tabbar div.on{color:var(--red)}
.mini{position:absolute;left:8px;right:8px;bottom:calc(54px + env(safe-area-inset-bottom,0px));height:56px;border-radius:12px;background:color-mix(in srgb,var(--fill) 94%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;gap:10px;padding:0 8px;z-index:4;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.mini .cv{width:40px;flex:none;border-radius:5px}.mini .ti{border:0;padding:0}.mini button{background:none;border:0;color:var(--fg);padding:6px}
.btn{border:0;background:var(--fill);color:var(--red);font-weight:600;font-size:16px;border-radius:10px;padding:12px 0;flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.back{color:var(--red);padding:12px 16px 0;display:flex;align-items:center;gap:2px;font-size:17px}
.dh{text-align:center;padding:8px 40px}.dh .cv{width:230px;max-width:70%;margin:10px auto;box-shadow:0 8px 24px rgba(0,0,0,.25)}.dh h3{margin:8px 0 2px;font-size:21px}.dh p{margin:0;color:var(--sub)}
.acts{display:flex;gap:10px;padding:14px 16px}
.srch{margin:6px 16px;display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:0 10px;color:var(--sub)}.srch input{flex:1;border:0;background:none;font-size:17px;padding:9px 0;color:var(--fg);outline:0;min-width:0}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}.gg div{border-radius:8px;padding:12px;height:84px;color:#fff;font-weight:700;font-size:16px;display:flex;align-items:flex-end}
.lr{display:flex;align-items:center;gap:14px;padding:0 16px;height:48px;color:var(--red);font-size:20px}.lr span{flex:1;color:var(--fg);border-bottom:.5px solid var(--sep);height:100%;display:flex;align-items:center;font-size:20px}
.chips{display:flex;gap:8px;overflow:auto;padding:0 16px 10px;scrollbar-width:none}.chips i{font-style:normal;white-space:nowrap;padding:6px 14px;border-radius:99px;background:var(--fill);font-size:14px}.chips i.on{background:var(--red);color:#fff}
.gridl{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px}
.hint{color:var(--sub);text-align:center;padding:30px 24px;font-size:14px;line-height:1.5}
.tl{background:none;border:0;color:var(--red);font-size:17px;padding:0}
/* full player */
.fp{position:absolute;inset:0;z-index:20;color:#fff;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 24px calc(env(safe-area-inset-bottom,0px) + 14px)}
.fp button{background:none;border:0;color:#fff;padding:6px;display:flex;align-items:center;justify-content:center}
.fp .top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}.fp .top div{text-align:center;font-size:12px;line-height:1.3;opacity:.8;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.mid .cv{width:min(100%,38vh);box-shadow:0 12px 32px rgba(0,0,0,.4);border-radius:10px;transition:transform .3s}.mid .cv.pa{transform:scale(.86)}
.pan{width:100%;height:100%;overflow:auto;padding:8px 0}.pan .tr{padding:6px 0}.pan .ti{border-color:rgba(255,255,255,.15)}.pan .ti span,.pan u{color:rgba(255,255,255,.65)}.pan button{font-size:18px;padding:4px 8px}
.tt{display:flex;align-items:center;gap:8px;margin-top:6px}.tt .ti{border:0;padding:0}.tt .ti b{font-size:21px;font-weight:700}.tt .ti span{color:rgba(255,255,255,.7);font-size:18px}
.rg{width:100%;margin:14px 0 2px;-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:rgba(255,255,255,.3);outline:0}.rg::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff}.rg::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:0}
.tm{display:flex;justify-content:space-between;font-size:12px;opacity:.7}
.ctl{display:flex;justify-content:space-between;align-items:center;margin:8px 0}.bot{display:flex;justify-content:space-around;margin-top:4px}.fp .on{color:#fff;background:rgba(255,255,255,.28);border-radius:8px}.fp .of{opacity:.6}
.menu{position:absolute;right:20px;top:calc(env(safe-area-inset-top,0px) + 54px);background:rgba(40,40,44,.97);border-radius:12px;z-index:30;min-width:180px;overflow:hidden}.menu div{padding:13px 16px;border-bottom:.5px solid rgba(255,255,255,.12);color:#fff}
.note{font-size:11px;text-align:center;opacity:.55;margin-top:2px}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),f=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const AL=[["Midnight Letters","Nova Reyes",2026,"팝",340],["Paper Moons","서하윤",2026,"K-POP",330],["Glass Harbor","The Hollow Pines",2025,"록",200],["Slow Parade","Mira Okafor",2026,"R&B",20],["Neon Orchard","DJ Kestrel",2026,"댄스",285],["Static Bloom","이도현",2025,"인디",150],["Velvet Hours","Aria Vale",2026,"재즈",35],["Low Tide","Coastline Kids",2025,"인디",190],["Afterglow Club","Nova Reyes",2025,"댄스",310],["Cedar & Smoke","Juniper Ray",2024,"어쿠스틱",28],["Golden Static","The Hollow Pines",2026,"록",48],["Blue Corridor","Sora Tanaka",2025,"재즈",220],["Wildflower Radio","한소율",2026,"어쿠스틱",120],["Satellite Hearts","Echo Lane",2026,"팝",260],["Honey Signal","서하윤",2024,"K-POP",8],["Quiet Engines","Echo Lane",2025,"일렉트로닉",175]].map((a,i)=>({id:i,t:a[0],ar:a[1],y:a[2],g:a[3],h:a[4]}));
const AD=['Open','Second','Parking Lot','Halfway','Cold','Paper','Slow','Soft','Night','Tin','Golden','Silent'],NO=['Window','Skin','Stars','Home','Coffee','Lantern','Sundial','Static','Bus','Roof','Orbit','Lake'];
const TR=[];AL.forEach(a=>{a.tr=[];for(let j=0;j<5;j++){const t={id:TR.length,t:AD[(a.id+j*5)%12]+' '+NO[(a.id*5+j*7+j)%12],a:a.id,ar:a.ar,d:150+(a.id*13+j*29)%120};TR.push(t);a.tr.push(t)}});
const ARS=[...new Set(AL.map(a=>a.ar))],GEN=[...new Set(AL.map(a=>a.g))];
const PL=[["오늘의 추천 Mix","당신을 위한 선곡"],["드라이브 플레이리스트","창문을 열고"],["집중 모드","조용한 작업용"],["새벽 감성","잠들기 전에"],["운동할 때","에너지 업"],["주말 오후","느긋한 휴일"]].map((p,i)=>({n:p[0],d:p[1],tr:Array.from({length:8},(_,k)=>TR[(i*11+k*9)%TR.length])}));
const R=[["Apple Music 1","새로운 음악과 아티스트 이야기"],["Apple Music Hits","시대를 넘나드는 히트곡"],["Apple Music Chill","편안한 분위기의 음악"],["K-POP 라디오","지금 가장 뜨거운 K-POP"],["재즈 라디오","라운지에서 듣는 재즈"],["인디 라디오","숨은 보석 같은 인디"],["록 라디오","기타 사운드 모음"],["댄스 라디오","밤을 위한 비트"]].map((r,i)=>({id:i,n:r[0],d:r[1],t:r[0],h:(i*47+10)%360}));
const S={tab:'home',stack:[],q:[],i:-1,pos:0,playing:false,sh:false,rp:0,full:false,m:'c',menu:false,fav:new Set(),lib:[0,3,6,9],ls:[2],lt:null,sort:'add',grid:false,edit:false,genre:null,sq:''};
let CTX=[];const L=l=>CTX.push(l)-1,cur=()=>S.q[S.i];
const ST=['search','shuffle','repeat','lyrics','queue','airplay','back','down','heart','plus','check'];
const IC={play:'M8 5v14l11-7z',pause:'M7 5h4v14H7zM13 5h4v14h-4z',next:'M6 5v14l9-7zM16 5h2.5v14H16z',prev:'M18 5v14l-9-7zM8 5H5.5v14H8z',home:'M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z',nw:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',radio:'M12 10a2 2 0 100 4 2 2 0 000-4zM5 12a7 7 0 017-7v2a5 5 0 00-5 5zM17 12a5 5 0 00-5-5V5a7 7 0 017 7zM12 17v2a7 7 0 007-7h-2a5 5 0 01-5 5z',lib:'M5 4h3v16H5zM10 4h3v16h-3zM15 5l3-1 3 15-3 1z',more:'M5 10.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM12 10.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM19 10.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3z',heartF:'M12 21s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 10c0 6-8 11-8 11z',
search:'M11 4a7 7 0 100 14 7 7 0 000-14zM16 16l5 5',shuffle:'M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4',repeat:'M4 11V9a3 3 0 013-3h12l-3-3M20 13v2a3 3 0 01-3 3H5l3 3',lyrics:'M4 5h16v11H9l-5 4z',queue:'M4 6h16M4 12h16M4 18h10',airplay:'M5 17H4V5h16v12h-1M8 21l4-5 4 5z',back:'M15 5l-7 7 7 7',down:'M5 9l7 7 7-7',heart:'M12 21s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 10c0 6-8 11-8 11z',plus:'M12 5v14M5 12h14',check:'M5 13l4 4 10-10'};
const I=(n,s=24)=>ST.includes(n)?`<svg width=${s} height=${s} viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=2 stroke-linecap=round stroke-linejoin=round><path d="${IC[n]}"/></svg>`:`<svg width=${s} height=${s} viewBox="0 0 24 24" fill=currentColor><path d="${IC[n]}"/></svg>`;
const cv=(a,r)=>{const h=a.h,s=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${h},75%,62%)'/><stop offset='1' stop-color='hsl(${(h+55)%360},70%,32%)'/></linearGradient></defs><rect width='100' height='100' fill='url(#g)'/><circle cx='${30+a.id*4%40}' cy='${70-a.id*3%30}' r='${22+a.id%3*6}' fill='hsla(${(h+180)%360},80%,70%,.45)'/><text x='50' y='60' font-size='28' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>${a.t[0]}</text></svg>`;return `<img class="cv${r?' r':''}" alt="" src="data:image/svg+xml,${encodeURIComponent(s)}">`};
const plCv=p=>cv(AL[p.tr[0].a]);
function render(keep=true){const sc=$('#sc'),y=keep&&sc?sc.scrollTop:0;CTX=[];const v=S.stack[S.stack.length-1];
$('#app').innerHTML=`<div class=scroll id=sc>${v?detail(v):TABS[S.tab]()}</div>${mini()}${tabbar()}${S.full?player():''}`;if(y)$('#sc').scrollTop=y}
const go=t=>{S.tab=t;S.stack=[];S.lt=null;render(false)},push=(t,id)=>{S.stack.push({t,id});render(false)},back=()=>{S.stack.pop();render(false)};
function tabbar(){return `<div class=tabbar>${[['home','홈','home'],['new','신곡','nw'],['radio','라디오','radio'],['lib','보관함','lib'],['search','검색','search']].map(t=>`<div class="${S.tab==t[0]?'on':''}" onclick="go('${t[0]}')">${I(t[2],24)}${t[1]}</div>`).join('')}</div>`}
function mini(){const c=cur();if(!c||S.full)return'';return `<div class=mini onclick="S.full=true;S.m='c';render()">${cv(AL[c.a])}<div class=ti><b>${c.t}</b><span>${c.ar}</span></div><button onclick="event.stopPropagation();tg()">${I(S.playing?'pause':'play',26)}</button><button onclick="event.stopPropagation();nx()">${I('next',26)}</button></div>`}
const card=(img,t,s,oc,c='')=>`<div class="card ${c}" onclick="${oc}">${img}<b>${t}</b><span>${s}</span></div>`;
const alc=a=>card(cv(a),a.t,a.ar,`push('al',${a.id})`),plc=i=>card(plCv(PL[i]),PL[i].n,PL[i].d,`push('pl',${i})`),arc=i=>card(cv(AL.find(a=>a.ar==ARS[i]),1),ARS[i],'아티스트',`push('ar',${i})`,'r');
const row=(t,a)=>`<h2 class=sec>${t}</h2><div class=hs>${a.join('')}</div>`;
const trl=(ts,o={})=>{const l=L(ts);return ts.map((t,i)=>{const on=cur()&&cur().id==t.id;return `<div class=tr onclick="pl(${l},${i})">${o.n?`<i class=n>${i+1}</i>`:cv(AL[t.a])}<div class=ti><b${on?' style="color:var(--red)"':''}>${t.t}</b><span>${t.ar}${o.al?' · '+AL[t.a].t:''}</span></div><u>${f(t.d)}</u></div>`}).join('')};
const TABS={
home:()=>`<h1>홈</h1>${row('추천',[2,0,13].map(i=>`<div class="card ban" onclick="push('al',${i})"><small>${i==0?'지금 들어보세요':i==2?'당신을 위한 선곡':'새로 나왔어요'}</small>${cv(AL[i])}<b>${AL[i].t}</b><span>${AL[i].ar}</span></div>`))}${row('최근 재생',[3,0,7,5,11,13].map(i=>alc(AL[i])))}${row('추천 플레이리스트',[0,1,2].map(plc))}${row('인기 앨범',[1,4,8,14,6,10].map(i=>alc(AL[i])))}${row('아티스트별 추천',ARS.slice(0,6).map((_,i)=>arc(i)))}${row('분위기별 음악',[3,4,5].map(plc))}`,
new:()=>{const g=S.genre,ga=AL.filter(a=>!g||a.g==g);return `<h1>신곡</h1>${row('신규 발매 앨범',AL.filter(a=>a.y==2026).map(alc))}<h2 class=sec>최신 싱글</h2>${trl(AL.filter(a=>a.y==2026).map(a=>a.tr[0]),{al:1})}${row('추천 플레이리스트',[1,4,5].map(plc))}<h2 class=sec>장르별 신곡</h2><div class=chips><i class="${g?'':'on'}" onclick="S.genre=null;render()">전체</i>${GEN.map(x=>`<i class="${g==x?'on':''}" onclick="S.genre='${x}';render()">${x}</i>`).join('')}</div><div class=hs>${ga.map(alc).join('')}</div><h2 class=sec>인기 음악</h2>${trl(TR.filter((_,i)=>i%7==2).slice(0,10),{n:1,al:1})}`},
radio:()=>`<h1>라디오</h1>${row('대표 라디오',R.slice(0,3).map(r=>`<div class="card ban" onclick="push('rd',${r.id})">${cv(r)}<b>${r.n}</b><span>${r.d}</span></div>`))}<h2 class=sec>추천 프로그램</h2>${R.slice(3,6).map(r=>`<div class=tr onclick="push('rd',${r.id})">${cv(r)}<div class=ti><b>${r.n}</b><span>${r.d}</span></div></div>`).join('')}${row('장르별 라디오',R.slice(3).map(r=>card(cv(r),r.n,r.d,`push('rd',${r.id})`)))}<div class=hint>※ 모의 콘텐츠입니다. 실제 라디오 방송이 아닙니다.</div>`,
lib:()=>{const k=S.lt;if(!k){const al=S.lib;return `<h1>보관함<button class=tl onclick="S.edit=!S.edit;render()">${S.edit?'완료':'편집'}</button></h1>${[['pl','플레이리스트','☰'],['ar','아티스트','♪'],['al','앨범','▣'],['so','곡','♫'],['mv','뮤직비디오','▶'],['dl','다운로드한 음악','↓']].map(c=>`<div class=lr onclick="S.lt='${c[0]}';render(false)">${c[2]}<span>${c[1]}</span></div>`).join('')}${row('최근 추가',al.slice().reverse().map(i=>alc(AL[i])))}`}
const t={pl:'플레이리스트',ar:'아티스트',al:'앨범',so:'곡',mv:'뮤직비디오',dl:'다운로드한 음악'}[k];let b='';
const srt=a=>S.sort=='name'?a.slice().sort((x,y)=>x.t.localeCompare(y.t)):a;
if(k=='pl')b=PL.map((p,i)=>`<div class=tr onclick="push('pl',${i})">${plCv(p)}<div class=ti><b>${p.n}</b><span>${p.d}</span></div></div>`).join('');
if(k=='ar')b=[...new Set(S.lib.map(i=>AL[i].ar))].map(n=>{const i=ARS.indexOf(n);return `<div class=tr onclick="push('ar',${i})">${cv(AL.find(a=>a.ar==n),1)}<div class=ti><b>${n}</b><span>아티스트</span></div></div>`}).join('')||'<div class=hint>저장한 앨범의 아티스트가 여기에 표시됩니다.</div>';
if(k=='al'){const a=srt(S.lib.map(i=>AL[i]));b=!a.length?'<div class=hint>저장한 앨범이 없습니다.</div>':S.grid?`<div class=gridl>${a.map(alc).join('').replace(/class="card "/g,'class=card style="flex:auto"')}</div>`:a.map(x=>`<div class=tr onclick="push('al',${x.id})">${cv(x)}<div class=ti><b>${x.t}</b><span>${x.ar}</span></div>${S.edit?`<button class=tl onclick="event.stopPropagation();tl(${x.id})">삭제</button>`:''}</div>`).join('')}
if(k=='so'){const ts=S.lib.flatMap(i=>AL[i].tr).concat(S.ls.map(i=>TR[i]).filter(t=>!S.lib.includes(t.a)));b=ts.length?trl(ts,{al:1}):'<div class=hint>저장한 곡이 없습니다.</div>'}
if(k=='mv'||k=='dl')b=`<div class=hint>${k=='mv'?'이 모의 앱에는 뮤직비디오 콘텐츠가 없습니다.':'다운로드한 음악이 없습니다. 이 모의 앱은 다운로드를 지원하지 않습니다.'}</div>`;
return `<div class=back onclick="S.lt=null;render(false)">${I('back',20)}보관함</div><h1>${t}</h1>${k=='al'?`<div style="padding:0 16px 6px;display:flex;gap:16px"><button class=tl style="font-size:15px" onclick="S.sort=S.sort=='name'?'add':'name';render()">정렬: ${S.sort=='name'?'이름순':'추가순'}</button><button class=tl style="font-size:15px" onclick="S.grid=!S.grid;render()">${S.grid?'목록 보기':'격자 보기'}</button></div>`:''}${b}`},
search:()=>`<h1>검색</h1><div class=srch>${I('search',18)}<input id=qi placeholder="아티스트, 곡, 앨범, 플레이리스트" value="${S.sq.replace(/"/g,'&quot;')}" oninput="S.sq=this.value;$('#res').innerHTML=res()"></div><div id=res>${res()}</div>`};
function res(){const q=S.sq.trim().toLowerCase();if(!q)return `<h2 class=sec>장르 둘러보기</h2><div class=gg>${GEN.map((g,i)=>`<div style="background:hsl(${(i*53+340)%360},65%,48%)" onclick="S.sq='${g}';render();$('#qi').focus()">${g}</div>`).join('')}</div>${row('추천',[0,2,3].map(plc).slice(0,3))}`;
const ts=TR.filter(t=>(t.t+t.ar+AL[t.a].t+AL[t.a].g).toLowerCase().includes(q)),ar=ARS.map((n,i)=>i).filter(i=>ARS[i].toLowerCase().includes(q)),al=AL.filter(a=>(a.t+a.ar+a.g).toLowerCase().includes(q)),pp=PL.map((p,i)=>i).filter(i=>PL[i].n.toLowerCase().includes(q));
if(!ts.length&&!ar.length&&!al.length&&!pp.length)return '<div class=hint>일치하는 결과가 없습니다.</div>';
return (ar.length?`<h2 class=sec>아티스트</h2>${ar.map(i=>`<div class=tr onclick="push('ar',${i})">${cv(AL.find(a=>a.ar==ARS[i]),1)}<div class=ti><b>${ARS[i]}</b><span>아티스트</span></div></div>`).join('')}`:'')+(al.length?row('앨범',al.map(alc)):'')+(pp.length?row('플레이리스트',pp.map(plc)):'')+(ts.length?`<h2 class=sec>곡</h2>${trl(ts.slice(0,20),{al:1})}`:'')}
function detail(v){let h='',ts=[],bt='';const bk=`<div class=back onclick="back()">${I('back',20)}뒤로</div>`;
if(v.t=='al'){const a=AL[v.id],on=S.lib.includes(a.id);ts=a.tr;h=`${cv(a)}<h3>${a.t}</h3><p style="color:var(--red);font-size:17px" onclick="push('ar',${ARS.indexOf(a.ar)})">${a.ar}</p><p>${a.g} · ${a.y}년</p>`;bt=`<button class=btn onclick="pl(${L(ts)},0)">${I('play',18)}재생</button><button class=btn onclick="S.sh=true;pl(${L(ts)},Math.floor(Math.random()*${ts.length}))">${I('shuffle',18)}셔플</button><button class=btn style="flex:0 0 52px" onclick="tl(${a.id})">${I(on?'check':'plus',20)}</button>`}
if(v.t=='pl'){const p=PL[v.id];ts=p.tr;h=`${plCv(p)}<h3>${p.n}</h3><p>${p.d} · ${ts.length}곡</p>`;bt=`<button class=btn onclick="pl(${L(ts)},0)">${I('play',18)}재생</button><button class=btn onclick="S.sh=true;pl(${L(ts)},Math.floor(Math.random()*${ts.length}))">${I('shuffle',18)}셔플</button>`}
if(v.t=='ar'){const n=ARS[v.id],as=AL.filter(a=>a.ar==n);ts=as.flatMap(a=>a.tr);h=`${cv(as[0],1)}<h3>${n}</h3><p>앨범 ${as.length}개 · 곡 ${ts.length}개</p>`;bt=`<button class=btn onclick="pl(${L(ts)},0)">${I('play',18)}재생</button><button class=btn onclick="S.sh=true;pl(${L(ts)},0)">${I('shuffle',18)}셔플</button>`;return `${bk}<div class=dh>${h}</div><div class=acts>${bt}</div>${row('앨범',as.map(alc))}<h2 class=sec>곡</h2>${trl(ts,{al:1})}`}
if(v.t=='rd'){const r=R[v.id];ts=TR.filter((_,i)=>(i+v.id)%5==0).slice(0,12);h=`${cv(r)}<h3>${r.n}</h3><p>${r.d}</p><p style="font-size:12px;margin-top:6px">모의 프로그램입니다. 실제 방송이 아니며 이 앱의 곡 목록을 모의 재생합니다.</p>`;bt=`<button class=btn onclick="pl(${L(ts)},0)">${I('play',18)}모의 재생</button>`}
return `${bk}<div class=dh>${h}</div><div class=acts>${bt}</div>${trl(ts,{n:v.t!='rd'&&v.t!='pl',al:v.t!='al'})}`}
function tl(id){const k=S.lib.indexOf(id);k<0?S.lib.push(id):S.lib.splice(k,1);render()}
function pl(l,i){S.q=CTX[l].slice();S.i=i;S.pos=0;S.playing=true;render()}
function tg(){if(cur()){S.playing=!S.playing;render()}}
function nx(auto){if(!S.q.length)return;let n=S.i+1;if(S.sh&&S.q.length>1){do n=Math.floor(Math.random()*S.q.length);while(n==S.i)}
if(n>=S.q.length){if(S.rp==1)n=0;else{S.pos=0;S.playing=false;render();return}}S.i=n;S.pos=0;render()}
function pv(){if(S.pos>3||S.i==0){S.pos=0}else S.i--;render()}
function player(){const c=cur(),a=AL[c.a],fv=S.fav.has(c.id),m=S.m;
const body=m=='c'?cv(a).replace('class="cv','class="cv'+(S.playing?'':' pa')):m=='l'?`<div class=pan><div class=hint style="color:#fff;opacity:.8;margin-top:30%">이 곡에는 시간 동기화 가사 데이터가 없습니다.<br>임의의 가사는 표시하지 않습니다.</div></div>`:`<div class=pan>${S.q.map((t,i)=>`<div class=tr onclick="S.i=${i};S.pos=0;S.playing=true;render()">${cv(AL[t.a])}<div class=ti><b${i==S.i?' style="color:#ff6b81"':''}>${t.t}</b><span>${t.ar}</span></div><button onclick="event.stopPropagation();mv(${i},-1)">↑</button><button onclick="event.stopPropagation();mv(${i},1)">↓</button><button onclick="event.stopPropagation();rm(${i})">✕</button></div>`).join('')}</div>`;
return `<div class=fp style="background:linear-gradient(160deg,hsl(${a.h},45%,38%),hsl(${(a.h+40)%360},50%,14%))"><div class=top><button onclick="S.full=false;S.menu=false;render()">${I('down',28)}</button><div><b>재생 중</b><br>${a.t}</div><button onclick="S.menu=!S.menu;render()">${I('more',26)}</button></div>${S.menu?`<div class=menu><div onclick="tl(${a.id});S.menu=false;render()">${S.lib.includes(a.id)?'보관함에서 제거':'보관함에 추가'}</div><div onclick="S.full=false;S.menu=false;S.stack=[{t:'al',id:${a.id}}];render(false)">앨범 보기</div><div onclick="S.full=false;S.menu=false;S.stack=[{t:'ar',id:${ARS.indexOf(a.ar)}}];render(false)">아티스트 보기</div></div>`:''}<div class=mid>${body}</div><div class=tt><div class=ti style="flex:1"><b>${c.t}</b><span>${c.ar}</span></div><button onclick="S.fav.has(${c.id})?S.fav.delete(${c.id}):S.fav.add(${c.id});render()" style="${fv?'color:#ff4d6a':''}">${I(fv?'heartF':'heart',24)}</button><button onclick="S.menu=!S.menu;render()">${I('more',24)}</button></div>
<input class=rg id=bar type=range min=0 max=${c.d} step=1 value=${Math.floor(S.pos)} oninput="S.pos=+this.value;upd()"><div class=tm><span id=pt>${f(S.pos)}</span><span id=rt>-${f(c.d-S.pos)}</span></div>
<div class=ctl><button class="${S.sh?'on':'of'}" onclick="S.sh=!S.sh;render()">${I('shuffle',24)}</button><button onclick="pv()">${I('prev',34)}</button><button onclick="tg()">${I(S.playing?'pause':'play',50)}</button><button onclick="nx()">${I('next',34)}</button><button class="${S.rp?'on':'of'}" onclick="S.rp=(S.rp+1)%3;render()">${I('repeat',24)}${S.rp==2?'<small>1</small>':''}</button></div>
<div class=bot><button class=of>${I('airplay',22)}</button><button class="${m=='l'?'on':'of'}" onclick="S.m=S.m=='l'?'c':'l';render()">${I('lyrics',22)}</button><button class="${m=='q'?'on':'of'}" onclick="S.m=S.m=='q'?'c':'q';render()">${I('queue',22)}</button></div><div class=note>모의 재생 · 실제 오디오 파일이 없어 진행 시간만 시뮬레이션합니다</div></div>`}
function mv(i,d){const j=i+d;if(j<0||j>=S.q.length)return;[S.q[i],S.q[j]]=[S.q[j],S.q[i]];if(S.i==i)S.i=j;else if(S.i==j)S.i=i;render()}
function rm(i){S.q.splice(i,1);if(!S.q.length){S.i=-1;S.playing=false;S.full=false}else{if(i<S.i)S.i--;else if(i==S.i){S.i=Math.min(S.i,S.q.length-1);S.pos=0}}render()}
function upd(){const c=cur();if(!c)return;const p=$('#pt');if(p){p.textContent=f(S.pos);$('#rt').textContent='-'+f(c.d-S.pos);if(document.activeElement!==$('#bar'))$('#bar').value=Math.floor(S.pos)}}
setInterval(()=>{const c=cur();if(!c||!S.playing)return;S.pos+=.25;if(S.pos>=c.d){if(S.rp==2){S.pos=0;upd()}else nx(1)}else upd()},250);
render();
</script></body></html>
